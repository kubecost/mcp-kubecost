{{- if .Values.config.kubecostApiKey.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-kubecost.apiKeySecretName" . }}
  labels:
    {{- include "mcp-kubecost.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.config.kubecostApiKey.key }}: {{ .Values.config.kubecostApiKey.value | quote }}
{{- end }}
{{- if and .Values.config.oidc.enabled (not .Values.config.oidc.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-kubecost.oidcSecretName" . }}
  labels:
    {{- include "mcp-kubecost.labels" . | nindent 4 }}
type: Opaque
stringData:
  OIDC_CLIENT_ID: {{ .Values.config.oidc.clientID | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.config.oidc.clientSecret | quote }}
  {{- if .Values.config.oidc.jwtSigningKey }}
  OIDC_JWT_SIGNING_KEY: {{ .Values.config.oidc.jwtSigningKey | quote }}
  {{- end }}
  {{- if .Values.config.oidc.storageEncryptionKey }}
  OIDC_STORAGE_ENCRYPTION_KEY: {{ .Values.config.oidc.storageEncryptionKey | quote }}
  {{- end }}
{{- end }}
