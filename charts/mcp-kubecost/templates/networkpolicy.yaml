{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-kubecost.fullname" . }}
  labels:
    {{- include "mcp-kubecost.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-kubecost.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: {{ .Values.networkPolicy.ingress | toYaml | nindent 4 }}
  egress: {{ .Values.networkPolicy.egress | toYaml | nindent 4 }}
{{- end }}
