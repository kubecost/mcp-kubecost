{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mcp-kubecost.fullname" . }}
  labels:
    {{- include "mcp-kubecost.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range $path := list "/mcp" "/oauth/mcp" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "mcp-kubecost.fullname" $ }}
                port:
                  name: http
          {{- end }}
          {{- /* The suffixed paths are the ones the server advertises; the bare ones are
               root-probe fallbacks for clients that never read the advertised URL. */}}
          {{- range $path := list "/.well-known/oauth-protected-resource/mcp" "/.well-known/oauth-authorization-server/oauth/mcp" "/.well-known/openid-configuration/oauth/mcp" "/.well-known/oauth-protected-resource" "/.well-known/oauth-authorization-server" "/.well-known/openid-configuration" }}
          - path: {{ $path }}
            pathType: Exact
            backend:
              service:
                name: {{ include "mcp-kubecost.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
