{{- include "mcp-kubecost.sanityChecks" . }}
{{- include "mcp-kubecost.validateHttpPath" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-kubecost.fullname" . }}
  labels:
    {{- include "mcp-kubecost.labels" . | nindent 4 }}
  {{- with include "mcp-kubecost.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "mcp-kubecost.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-kubecost.selectorLabels" . | nindent 8 }}
        {{- with ((.Values.global).additionalLabels) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $apikeyChecksum := include "mcp-kubecost.apikey-stringdata" . }}
      {{- $oidcChecksum := include "mcp-kubecost.oidc-stringdata" . }}
      {{- $podAnnotations := include "mcp-kubecost.podAnnotations" . }}
      {{- if or $podAnnotations .Values.reloadOnConfigChange }}
      annotations:
        {{- with $podAnnotations }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if .Values.reloadOnConfigChange }}
        checksum/config: {{ include "mcp-kubecost.configmap-data" . | sha256sum }}
        {{- if $apikeyChecksum }}
        checksum/secret-api-key: {{ $apikeyChecksum | sha256sum }}
        {{- end }}
        {{- if $oidcChecksum }}
        checksum/secret-oidc: {{ $oidcChecksum | sha256sum }}
        {{- end }}
        {{- end }}
      {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      enableServiceLinks: false
      securityContext:
        {{- include "mcp-kubecost.podSecurityContext" . | nindent 8 }}
      {{- include "mcp-kubecost.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: mcp-kubecost
          image: {{ include "mcp-kubecost.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "mcp-kubecost.configMapName" . }}
          {{- $hasApiKey := or .Values.config.kubecostApiKey.value .Values.config.kubecostApiKey.existingSecret }}
          {{- $hasOidc := or .Values.config.oidc.existingSecret (and .Values.config.oidc.clientId .Values.config.oidc.clientSecret) }}
          {{- if or $hasApiKey $hasOidc }}
          env:
            {{- if $hasApiKey }}
            - name: KUBECOST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.config.kubecostApiKey.existingSecret }}{{ .Values.config.kubecostApiKey.existingSecret }}{{ else }}{{ include "mcp-kubecost.apiKeySecretName" . }}{{ end }}
                  key: {{ .Values.config.kubecostApiKey.key }}
            {{- end }}
            {{- if $hasOidc }}
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.config.oidc.existingSecret }}{{ .Values.config.oidc.existingSecret }}{{ else }}{{ include "mcp-kubecost.oidcSecretName" . }}{{ end }}
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.config.oidc.existingSecret }}{{ .Values.config.oidc.existingSecret }}{{ else }}{{ include "mcp-kubecost.oidcSecretName" . }}{{ end }}
                  key: OIDC_CLIENT_SECRET
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.containerSecurityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.containerSecurityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
                {{- toYaml .Values.containerSecurityContext.capabilitiesDrop | nindent 16 }}
          {{- if .Values.probes.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            failureThreshold: {{ .Values.probes.failureThreshold }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          {{- end }}
          {{- if .Values.config.ssl.caBundle.existingSecret }}
          volumeMounts:
            - name: ca-bundle
              mountPath: {{ .Values.config.ssl.caBundle.mountPath }}
              subPath: {{ .Values.config.ssl.caBundle.key }}
              readOnly: true
          {{- end }}
      {{- if .Values.config.ssl.caBundle.existingSecret }}
      volumes:
        - name: ca-bundle
          secret:
            secretName: {{ .Values.config.ssl.caBundle.existingSecret }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
