{{- include "mcp-kubecost.sanityChecks" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-kubecost.fullname" . }}
  labels:
    {{- include "mcp-kubecost.labels" . | nindent 4 }}
    {{- with ((.Values.deployment).labels) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with include "mcp-kubecost.annotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ ((.Values.deployment).replicas) | default 1 }}
  {{- with ((.Values.deployment).strategy) }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mcp-kubecost.selectorLabels" . | nindent 6 }}
      {{- with ((.Values.deployment).selector) }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  template:
    metadata:
      labels:
        {{- include "mcp-kubecost.selectorLabels" . | nindent 8 }}
        {{- with ((.Values.deployment).selector) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with ((.Values.global).additionalLabels) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $apikeyChecksum := include "mcp-kubecost.apikey-stringdata" . }}
      {{- $oidcChecksum := include "mcp-kubecost.oidc-stringdata" . }}
      {{- $podAnnotations := include "mcp-kubecost.podAnnotations" . }}
      {{- if or $podAnnotations .Values.reloadOnConfigChange }}
      annotations:
        {{- with $podAnnotations }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if .Values.reloadOnConfigChange }}
        checksum/config: {{ include "mcp-kubecost.configmap-data" . | sha256sum }}
        {{- if $apikeyChecksum }}
        checksum/secret-api-key: {{ $apikeyChecksum | sha256sum }}
        {{- end }}
        {{- if $oidcChecksum }}
        checksum/secret-oidc: {{ $oidcChecksum | sha256sum }}
        {{- end }}
        {{- end }}
      {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      enableServiceLinks: false
      securityContext:
        {{- include "mcp-kubecost.podSecurityContext" . | nindent 8 }}
      {{- with include "mcp-kubecost.imagePullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- if include "mcp-kubecost.updateCaTrustEnabled" . }}
      {{- $ca := ((.Values.global).updateCaTrust) }}
      {{- $extracted := include "mcp-kubecost.caTrustExtractedDir" . }}
      initContainers:
        # Merge the mounted anchors with the image's public anchors into the shared
        # emptyDir below, which becomes OpenSSL's default trust store for the main
        # container. `trust extract` rather than the parent chart's
        # `update-ca-trust extract`: the latter needs root, because p11-kit chmods
        # extracted/pem/directory-hash to 0555 mid-run and then fails to symlink
        # into it. This form writes one file and runs happily as the pod's
        # non-root UID.
        - name: update-ca-trust
          image: {{ include "mcp-kubecost.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - >-
              trust extract --format=pem-bundle --filter=ca-anchors
              --purpose server-auth --overwrite {{ $extracted }}/tls-ca-bundle.pem
          securityContext:
            {{- include "mcp-kubecost.containerSecurityContext" . | nindent 12 }}
          {{- with $ca.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: ca-certs
              mountPath: {{ $ca.caCertsMountPath | quote }}
              readOnly: true
            - name: ssl-path
              mountPath: {{ $extracted | quote }}
      {{- end }}
      containers:
        - name: mcp-kubecost
          image: {{ include "mcp-kubecost.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "mcp-kubecost.configMapName" . }}
          {{- $hasApiKey := or .Values.config.kubecostApiKey.value .Values.config.kubecostApiKey.existingSecret }}
          {{- $hasOidc := or .Values.config.oidc.existingSecret (and .Values.config.oidc.clientID .Values.config.oidc.clientSecret) }}
          {{- if or $hasApiKey $hasOidc .Values.extraEnv }}
          env:
            {{- if $hasApiKey }}
            - name: KUBECOST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.config.kubecostApiKey.existingSecret }}{{ .Values.config.kubecostApiKey.existingSecret }}{{ else }}{{ include "mcp-kubecost.apiKeySecretName" . }}{{ end }}
                  key: {{ .Values.config.kubecostApiKey.key }}
            {{- end }}
            {{- if $hasOidc }}
            {{- $oidcSecretName := ternary .Values.config.oidc.existingSecret (include "mcp-kubecost.oidcSecretName" .) (ne .Values.config.oidc.existingSecret "") }}
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $oidcSecretName }}
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $oidcSecretName }}
                  key: OIDC_CLIENT_SECRET
            {{- if or .Values.config.oidc.jwtSigningKey .Values.config.oidc.existingSecret }}
            - name: OIDC_JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $oidcSecretName }}
                  key: OIDC_JWT_SIGNING_KEY
                  {{- if .Values.config.oidc.existingSecret }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- if or .Values.config.oidc.storageEncryptionKey .Values.config.oidc.existingSecret }}
            - name: OIDC_STORAGE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $oidcSecretName }}
                  key: OIDC_STORAGE_ENCRYPTION_KEY
                  {{- if .Values.config.oidc.existingSecret }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "mcp-kubecost.containerSecurityContext" . | nindent 12 }}
          {{- if .Values.probes.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            failureThreshold: {{ .Values.probes.failureThreshold }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          {{- end }}
          volumeMounts:
            - name: oauth-storage
              mountPath: /var/lib/mcp-kubecost
          {{- if .Values.config.ssl.caBundle.existingSecret }}
            - name: ca-bundle
              mountPath: {{ .Values.config.ssl.caBundle.mountPath }}
              subPath: {{ .Values.config.ssl.caBundle.key }}
              readOnly: true
          {{- end }}
          {{- if include "mcp-kubecost.updateCaTrustEnabled" . }}
            - name: ssl-path
              mountPath: {{ include "mcp-kubecost.caTrustExtractedDir" . | quote }}
              readOnly: true
          {{- end }}
      volumes:
        - name: oauth-storage
          {{- if include "mcp-kubecost.persistenceEnabled" . }}
          persistentVolumeClaim:
            claimName: {{ include "mcp-kubecost.oauthStorageClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- if .Values.config.ssl.caBundle.existingSecret }}
        - name: ca-bundle
          secret:
            secretName: {{ .Values.config.ssl.caBundle.existingSecret }}
      {{- end }}
      {{- if include "mcp-kubecost.updateCaTrustEnabled" . }}
      {{- $ca := ((.Values.global).updateCaTrust) }}
        - name: ca-certs
          {{- if $ca.caCertsSecret }}
          secret:
            secretName: {{ $ca.caCertsSecret }}
            defaultMode: 420
          {{- else }}
          configMap:
            name: {{ $ca.caCertsConfig }}
            defaultMode: 420
          {{- end }}
        # Writable trust store for the init container's output. An emptyDir keeps
        # readOnlyRootFilesystem intact and is repopulated on every pod start, so
        # the bundle can never go stale against the image's public anchors.
        - name: ssl-path
          emptyDir: {}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
