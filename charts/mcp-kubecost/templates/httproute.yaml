{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mcp-kubecost.fullname" . }}
  labels:
    {{- include "mcp-kubecost.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
        - path:
            type: PathPrefix
            value: /oauth/mcp
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource/mcp
        - path:
            type: Exact
            value: /.well-known/oauth-authorization-server/oauth/mcp
        - path:
            type: Exact
            value: /.well-known/openid-configuration/oauth/mcp
      backendRefs:
        - name: {{ include "mcp-kubecost.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
