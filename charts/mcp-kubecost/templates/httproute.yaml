{{- if .Values.httpRoute.enabled }}
{{- $rules := deepCopy .Values.httpRoute.rules }}
{{- range $rules }}
  {{- if not (hasKey . "backendRefs") }}
    {{- $_ := set . "backendRefs" (list (dict "name" (include "mcp-kubecost.fullname" $) "port" $.Values.service.port)) }}
  {{- end }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mcp-kubecost.fullname" . }}
  labels:
    {{- include "mcp-kubecost.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- toYaml $rules | nindent 4 }}
{{- end }}
