# global values are merged from a parent Kubecost chart when this chart is a
# subchart. They are ignored unless set. Extra parent keys (clusterId, etc.)
# are accepted and unused. Keys and defaults here mirror the parent chart:
# https://github.com/kubecost/kubecost/blob/develop/kubecost/values.yaml
global:
  # global.imageRegistry overrides image.registry for every image in this chart.
  # Kubecost distributes via IBM Cloud Container Registry, so the default matches
  # the parent chart's global.imageRegistry rather than being empty.
  imageRegistry: icr.io
  # global.imagePullSecrets is merged with image.pullSecrets.
  # E.g.
  # imagePullSecrets:
  #   - myRegistryKeySecretName
  imagePullSecrets: []
  # global.annotations are added to this chart's Deployment metadata. Matches the
  # parent chart, where global.annotations applies to all controllers.
  annotations: {}
  # global.podAnnotations are added to this chart's pod template. Merged with the
  # chart-local podAnnotations; chart-local keys win on conflict.
  podAnnotations: {}
  # global.additionalLabels are added to this chart's resources and pod template.
  # They are never added to selector labels, which must stay immutable.
  additionalLabels: {}
  platforms:
    # global.platforms.openshift matches the Kubecost parent-chart OpenShift block.
    openshift:
      # Set to true when deploying to OpenShift. The restricted-v2 SCC rejects the
      # explicit runAsUser/runAsGroup in podSecurityContext below, so the
      # securityContext here replaces it, exactly as the parent chart does.
      enabled: false
      # global.platforms.openshift.securityContext replaces podSecurityContext
      # when openshift.enabled is true, letting OpenShift assign the UID/GID.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    # global.platforms.cicd matches the Kubecost parent-chart CI/CD block.
    cicd:
      # Set to true when using Argo CD or similar tools so skipSanityChecks applies.
      enabled: false
      # Skip Secret existence lookups that fail when Helm cannot see the cluster
      # (Argo CD dry-run / helm template) or when Secrets are created in a later wave.
      skipSanityChecks: false

# nameOverride replaces the chart name portion of generated resource names.
nameOverride: ""

# fullnameOverride replaces the full generated resource name.
fullnameOverride: ""

image:
  # image.registry is the container registry host. Overridden by global.imageRegistry.
  registry: icr.io
  # image.repository is the image path within the registry (no host).
  repository: kubecost/mcp-kubecost
  # image.tag is the container image tag. Defaults to the chart appVersion when empty.
  tag: ""
  # image.pullPolicy controls when Kubernetes pulls the image.
  pullPolicy: IfNotPresent
  # image.pullSecrets is a list of Secret names for private image registries.
  pullSecrets: []

# podAnnotations are annotations added to the MCP server pod template.
podAnnotations: {}

# podLabels are additional labels added to the MCP server pod template.
podLabels: {}

# reloadOnConfigChange causes the pod to restart automatically when the ConfigMap or Secrets
# change. Set to false if your CI/CD tooling manages rollouts independently (e.g. Argo CD,
# Flux, or a pipeline that handles rollouts after config updates).
reloadOnConfigChange: true

podSecurityContext:
  # podSecurityContext.runAsUser is the non-root UID used by the container.
  runAsUser: 65532
  # podSecurityContext.runAsGroup is the non-root GID used by the container.
  runAsGroup: 65532
  # podSecurityContext.runAsNonRoot prevents the container from running as root.
  runAsNonRoot: true
  # podSecurityContext.seccompProfile applies the Kubernetes runtime seccomp profile.
  seccompProfile:
    type: RuntimeDefault
  # podSecurityContext.fsGroup makes the OAuth state PVC writable by the non-root process.
  fsGroup: 65532
  # Avoid recursively changing ownership after the volume root already has the expected group.
  fsGroupChangePolicy: OnRootMismatch

containerSecurityContext:
  # containerSecurityContext.allowPrivilegeEscalation prevents gaining extra privileges.
  allowPrivilegeEscalation: false
  # containerSecurityContext.readOnlyRootFilesystem prevents writes to the image filesystem.
  readOnlyRootFilesystem: true
  # containerSecurityContext.capabilitiesDrop removes all ambient Linux capabilities.
  capabilitiesDrop:
    - ALL

# automountServiceAccountToken controls whether the pod receives a Kubernetes API token.
automountServiceAccountToken: false

service:
  # service.type is the Kubernetes Service type.
  type: ClusterIP
  # service.port is the Service port exposed to other pods and ingress controllers.
  port: 3030
  # service.annotations are annotations added to the Service.
  annotations: {}

httpRoute:
  # httpRoute.enabled controls whether a Gateway API HTTPRoute is rendered.
  enabled: false
  # httpRoute.annotations are annotations added to the HTTPRoute.
  annotations: {}
  # httpRoute.parentRefs identifies the existing Gateway and optional listener to attach to.
  parentRefs:
    - name: mcp-gateway
      sectionName: https
  # httpRoute.hostnames are the hostnames matched by the Gateway listener.
  hostnames:
    - mcp.example.com
  # The chart generates matches for /mcp, /oauth/mcp, and the required
  # well-known discovery paths. Requests are forwarded without path rewrites.

ingress:
  # ingress.enabled controls whether the legacy Kubernetes Ingress is rendered.
  # Prefer httpRoute.enabled when the cluster has Gateway API support.
  enabled: false
  # ingress.className is the IngressClass name.
  className: nginx
  # ingress.annotations are annotations added to the Ingress.
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http
  # ingress.hosts configures hostnames routed to the MCP server. The chart
  # generates the same fixed paths as the HTTPRoute.
  hosts:
    - host: mcp.example.com
  # ingress.tls configures TLS secrets and their hostnames.
  tls:
    - secretName: kubecost-mcp-server-tls
      hosts:
        - mcp.example.com

resources:
  # resources.requests and resources.limits define the pod's CPU and memory budget.
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 1Gi

# persistence controls the PVC that stores FastMCP OAuth registrations, grants, and tokens.
# Tokens are encrypted before FileTreeStore writes them beneath the mount point.
# If persistence is disabled, clients are forced to re-register whenever the pod restarts.
persistence:
  # persistence.enabled accepts three states:
  #   null (default) — auto: PVC is created when config.authMode is "oidc", omitted otherwise.
  #   true           — always create the PVC regardless of authMode.
  #   false          — never create the PVC (clients re-register on every pod restart).
  enabled: null
  # Empty uses the cluster's default StorageClass.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}

# Defaults to one replica with Recreate, which is required for the RWO OAuth PVC.
# Multiple replicas are supported when an MCP gateway or OAuth proxy owns session
# state in front of this chart (authMode none/open/api_key and persistence off).
# FileTreeStore is single-writer, so replicas > 1 is rejected while a PVC is
# mounted or authMode is oidc. Switch strategy to RollingUpdate when scaling out.
deployment:
  # deployment.replicas is the number of replicas to run.
  replicas: 1
  # deployment.strategy is the Kubernetes Deployment strategy.
  strategy:
    type: Recreate
  # deployment.annotations are merged into Deployment metadata; keys here win over
  # global.annotations.
  annotations: {}
  # deployment.labels are additional labels on Deployment metadata only (not selectors).
  labels: {}
  # Extra matchLabels on spec.selector and the pod template. Immutable after install.
  selector: {}

probes:
  # probes.enabled enables HTTP startup, readiness, and liveness checks.
  enabled: true
  # probes.path is the unauthenticated liveness endpoint (GET /health).
  # Do not point this at /mcp — kubelet cannot present OIDC or X-API-KEY.
  path: /health
  # probes.initialDelaySeconds delays the first liveness/readiness checks.
  initialDelaySeconds: 5
  # probes.periodSeconds is the interval between probe requests.
  periodSeconds: 10
  # probes.timeoutSeconds is the probe request timeout.
  timeoutSeconds: 3
  # probes.failureThreshold is the number of failures before the container is considered unhealthy.
  failureThreshold: 3

# Full authentication reference: docs/auth/auth-technical.md
# Authentication overview and mode selection: docs/auth/README.md
config:
  # config.authMode controls how the MCP HTTP endpoint is protected.
  # Supported values: none, open, oidc, api_key.
  #   none    — no auth (default); NOT permitted when httproute or ingress is enabled
  #   open    — no auth enforcement, but explicitly acknowledged as exposed (required minimum when httproute or ingress is enabled)
  #   oidc    — require a valid OIDC token via FastMCP's OIDCProxy
  #   api_key — require X-API-KEY header (same as requireClientApiKey: true)
  # To require both OIDC and X-API-KEY, set authMode: oidc and requireClientApiKey: true.
  authMode: "none"
  # config.kubecostApiBaseUrl is the required base URL of the Kubecost API (scheme + host only).
  # Must not include a port — use kubecostApiPort for that.
  # Evaluated with tpl, so umbrella charts may pass "http://{{ .Release.Name }}-frontend".
  # The standalone default assumes the Kubecost frontend is in the kubecost namespace.
  kubecostApiBaseUrl: http://kubecost-frontend.kubecost.svc.cluster.local
  # config.kubecostApiPort is appended to kubecostApiBaseUrl to form KUBECOST_BASE_URL.
  kubecostApiPort: 9090
  # config.kubecostApiBasePath is the path prefix used for Kubecost API calls.
  kubecostApiBasePath: /model
  # config.kubecostApiKey is sent to Kubecost as an X-API-KEY request header.
  # An MCP client may override it per request by sending its own X-API-KEY header.
  # Use with authMode oidc, open, or none for a shared outbound key.
  # config.kubecostApiKey.value optionally creates a Secret containing the API key; prefer existingSecret.
  kubecostApiKey:
    value: ""
    # config.kubecostApiKey.existingSecret is the name of a pre-created Secret containing the API key.
    existingSecret: ""
    # config.kubecostApiKey.key is the key in the existing or generated API-key Secret.
    key: KUBECOST_API_KEY
  # config.requireClientApiKey rejects HTTP requests that arrive without an X-API-KEY
  # header. When authMode is "api_key", this value is ignored and forced to true.
  # Set it to true with authMode "oidc" to require both OIDC and an API key.
  requireClientApiKey: false
  # config.requestTimeoutSeconds is the Kubecost HTTP request timeout in seconds.
  requestTimeoutSeconds: 15
  # config.requestRetryCount is the number of configured HTTP retries.
  requestRetryCount: 2
  # Sustained MCP request rate per pod. FastMCP uses a token bucket.
  rateLimitRequestsPerSecond: 10
  # Maximum burst size for the MCP request rate limiter.
  rateLimitBurstCapacity: 20
  # Maximum tool calls executing concurrently per pod.
  maxConcurrentToolCalls: 10
  # config.defaultWindow is the default Kubecost query window.
  defaultWindow: 15d
  # config.logLevel is the FastMCP log level ('DEBUG', 'INFO', 'WARNING', 'ERROR', 'CRITICAL').
  logLevel: INFO
  # config.useCacViews enables Kubecost CAC views.
  useCacViews: false
  # config.legacyTextContent restores the full JSON payload in each tool
  # result's text content, duplicating structuredContent. Leave false unless
  # a client cannot read structuredContent; true roughly doubles token usage.
  legacyTextContent: false
  # config.externalUrl is the public origin of this MCP server, with no path.
  # Required for OIDC unless the chart can infer it from exactly one enabled
  # Ingress or HTTPRoute containing exactly one non-wildcard hostname.
  # The fixed public URLs are /mcp and /oauth/mcp on this origin.
  externalUrl: ""

  # Enable FastMCP's Host/Origin request guard. "auto" protects local binds and
  # activates strict checks when either allowlist below is configured.
  fastmcpHttpHostOriginProtection: auto
  # JSON array string of permitted HTTP Host headers.
  fastmcpHttpAllowedHosts: ""
  # JSON array string of permitted browser Origin headers.
  fastmcpHttpAllowedOrigins: ""
  # config.mcpServerName overrides the MCP server name exposed by FastMCP.
  mcpServerName: mcp-kubecost
  # config.telemetryMode controls the OpenTelemetry wrapper; off disables it.
  telemetryMode: "off"
  # config.otelServiceName is the OpenTelemetry service name.
  otelServiceName: mcp-kubecost
  # config.otelExporterOtlpEndpoint is the OTLP endpoint used when telemetry is enabled.
  otelExporterOtlpEndpoint: ""
  # config.otelMetricsExporter selects the OTEL metrics exporter, such as none.
  otelMetricsExporter: none
  # config.otelLogsExporter selects the OTEL logs exporter, such as none.
  otelLogsExporter: none
  ssl:
    # config.ssl.verify controls Kubecost TLS certificate verification.
    verify: true
    caBundle:
      # config.ssl.caBundle.existingSecret is the Secret containing a custom CA certificate.
      existingSecret: ""
      # config.ssl.caBundle.key is the key in the custom CA Secret.
      key: ca.crt
      # config.ssl.caBundle.mountPath is the file path passed to SSL_CA_BUNDLE.
      mountPath: /etc/mcp-kubecost/ca/ca.crt

  oidc:
    # config.oidc.issuerUrl is the identity provider's OIDC discovery-document URL.
    # Example: https://sso.example.com/.well-known/openid-configuration
    issuerUrl: ""
    # config.oidc.audience is the token audience expected by the provider (optional).
    audience: ""
    # config.oidc.requiredScopes is a comma-separated list of OAuth scopes to request.
    requiredScopes: "openid,profile"
    # Optional JSON array of allowed downstream MCP-client redirect URI patterns.
    # Leave empty for the Open default, which supports standards-compatible DCR/CIMD
    # clients. This does not configure the upstream IdP callback.
    # Example Restricted posture: '["http://localhost:*", "https://client.example/callback"]'
    allowedClientRedirectUris: ""
    # config.oidc.clientID is the OIDC client ID. Prefer existingSecret for production.
    clientID: ""
    # config.oidc.clientSecret is the OIDC client secret. Prefer existingSecret for production.
    clientSecret: ""
    # Optional — auto-generated as an ephemeral key at startup when unset. Set explicitly in
    # production to ensure token consistency across restarts.
    # Generate with: openssl rand -base64 32
    jwtSigningKey: ""
    # Optional — auto-generated as an ephemeral Fernet key at startup when unset. Leaving this
    # unset wipes the OAuth storage directory on every restart, so clients must re-register and
    # re-authorize after each redeploy. Set explicitly in production to preserve OAuth sessions.
    # Generate with: openssl rand -base64 32
    storageEncryptionKey: ""
    # Pre-created Secret containing the four OIDC secret values above.
    existingSecret: ""

nodeSelector: {}
tolerations: []
affinity: {}
