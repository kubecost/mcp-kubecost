# Values merged from a parent Kubecost chart when this chart is a subchart.
# Parent values win. Extra parent keys are accepted and unused.
# Ref: https://github.com/kubecost/kubecost/blob/develop/kubecost/values.yaml
global:
  # Overrides image.registry for every image in this chart.
  imageRegistry: icr.io
  # Merged with image.pullSecrets. Accepts names or {name: ...} maps.
  imagePullSecrets: []
  # Added to this chart's Deployment metadata.
  annotations: {}
  # Merged into the pod template; chart-local podAnnotations win.
  podAnnotations: {}
  # Added to resources and the pod template, never to selector labels.
  additionalLabels: {}
  platforms:
    openshift:
      # Replaces podSecurityContext below, because the restricted-v2 SCC rejects
      # an explicit runAsUser/runAsGroup and assigns its own IDs.
      enabled: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    cicd:
      # Set both when Helm cannot see the cluster (Argo CD dry-run) or Secrets
      # are created in a later sync wave, to skip Secret existence lookups.
      enabled: false
      skipSanityChecks: false

# Replaces the chart name portion of generated resource names.
nameOverride: ""

# Replaces the full generated resource name.
fullnameOverride: ""

image:
  registry: icr.io
  repository: kubecost/mcp-kubecost
  # Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

podAnnotations: {}

podLabels: {}

# Restart the pod when the ConfigMap or Secrets change. Set false when CI/CD
# tooling manages rollouts (Argo CD, Flux).
reloadOnConfigChange: true

podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  # Makes the OAuth state volume writable by the non-root process.
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

automountServiceAccountToken: false

service:
  type: ClusterIP
  port: 3030
  annotations: {}

# Acknowledge serving the MCP endpoint without authentication. Required when
# ingress or httpRoute is enabled while neither config.oidc.enabled nor
# config.requireClientApiKey is set.
allowUnauthenticatedExposure: false

httpRoute:
  # Requires parentRefs and hostnames below; the chart fails rather than
  # attaching to a placeholder Gateway.
  enabled: false
  annotations: {}
  parentRefs: []
    # - name: mcp-gateway
    #   sectionName: https
  # A single non-wildcard hostname here is what config.externalUrl is inferred from.
  hostnames: []
    # - mcp.example.com

ingress:
  # Prefer httpRoute when the cluster has Gateway API support.
  enabled: false
  # Empty leaves the cluster's default IngressClass to claim the Ingress.
  className: ""
  # Certificate issuance is left to the operator, e.g.
  #   cert-manager.io/cluster-issuer: letsencrypt-http
  annotations: {}
  # A single non-wildcard host here is what config.externalUrl is inferred from.
  hosts: []
    # - host: mcp.example.com
  tls: []
    # - secretName: kubecost-mcp-server-tls
    #   hosts:
    #     - mcp.example.com

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 1Gi

# PVC for FastMCP OAuth registrations, grants, and tokens, created only when
# config.oidc.enabled is true. Set false to use an emptyDir instead, forcing
# clients to re-register whenever the pod restarts.
persistence:
  enabled: true
  # Empty falls back to global.defaultStorageClass, then the cluster default.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}

# FileTreeStore is single-writer, so replicas > 1 is rejected while OIDC is on.
# Run multiple replicas only behind an MCP gateway or OAuth proxy that owns
# session state, and switch strategy to RollingUpdate when scaling out.
deployment:
  replicas: 1
  strategy:
    type: Recreate
  # Merged into Deployment metadata; keys here win over global.annotations.
  annotations: {}
  labels: {}
  # Extra matchLabels on spec.selector and the pod template. Immutable after install.
  selector: {}

# Startup, readiness, and liveness checks against the unauthenticated GET /health.
# Do not point path at /mcp — kubelet cannot present OIDC or X-API-KEY.
probes:
  enabled: true
  path: /health
  startup:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

config:
  # Base URL of the Kubecost API (scheme + host, no port). Evaluated with tpl,
  # so umbrella charts may pass "http://{{ .Release.Name }}-aggregator".
  kubecostApiBaseUrl: http://kubecost-frontend.kubecost.svc.cluster.local
  kubecostApiPort: 9090
  kubecostApiBasePath: /model
  # Sent to Kubecost as an X-API-KEY header on outbound calls. An MCP client may
  # override it per request with its own X-API-KEY header.
  kubecostApiKey:
    # Creates a Secret containing the key; prefer existingSecret.
    value: ""
    existingSecret: ""
    # Key within the existing or generated Secret.
    key: KUBECOST_API_KEY
  # Reject inbound requests that arrive without an X-API-KEY header. Combines
  # with config.oidc.enabled to require both.
  requireClientApiKey: false
  requestTimeoutSeconds: 15
  requestRetryCount: 2
  # Sustained MCP request rate per pod (FastMCP token bucket), and its burst size.
  rateLimitRequestsPerSecond: 10
  rateLimitBurstCapacity: 20
  # Tool calls executing concurrently per pod.
  maxConcurrentToolCalls: 10
  defaultWindow: 15d
  # DEBUG, INFO, WARNING, ERROR, or CRITICAL.
  logLevel: INFO
  useCacViews: false
  # Restore the full JSON payload in each tool result's text content, duplicating
  # structuredContent. Roughly doubles token usage.
  legacyTextContent: false
  # Public origin of this server, scheme and host only. Required when OIDC is
  # enabled unless it can be inferred from exactly one enabled route with exactly
  # one non-wildcard hostname. The public URLs are /mcp and /oauth/mcp on this origin.
  externalUrl: ""
  # FastMCP Host/Origin request guard. "auto" protects local binds and activates
  # strict checks when either allowlist below is set. Both are JSON array strings.
  fastmcpHttpHostOriginProtection: auto
  fastmcpHttpAllowedHosts: ""
  fastmcpHttpAllowedOrigins: ""
  mcpServerName: mcp-kubecost
  # OpenTelemetry wrapper; "off" disables it.
  telemetryMode: "off"
  otelServiceName: mcp-kubecost
  otelExporterOtlpEndpoint: ""
  otelMetricsExporter: none
  otelLogsExporter: none
  ssl:
    verify: true
    caBundle:
      existingSecret: ""
      key: ca.crt
      mountPath: /etc/mcp-kubecost/ca/ca.crt

  # Require a valid OIDC token via FastMCP's OIDCProxy.
  # Full reference: docs/auth/auth-technical.md — overview: docs/auth/README.md
  oidc:
    enabled: false
    # The provider's OIDC discovery-document URL.
    # Example: https://sso.example.com/.well-known/openid-configuration
    issuerUrl: ""
    audience: ""
    # Comma-separated OAuth scopes to request.
    requiredScopes: "openid,profile"
    # JSON array of allowed downstream MCP-client redirect URI patterns. Empty
    # keeps the Open default, which supports standards-compatible DCR/CIMD
    # clients. This does not configure the upstream IdP callback.
    # Example: '["http://localhost:*", "https://client.example/callback"]'
    allowedClientRedirectUris: ""
    # Prefer existingSecret in production. Register
    # https://<externalUrl host>/oauth/mcp/callback as the redirect URI at the IdP.
    clientID: ""
    clientSecret: ""
    # Both auto-generate as ephemeral keys at startup when unset. An ephemeral
    # storage key wipes OAuth storage on every restart, forcing clients to
    # re-register. Generate with: openssl rand -base64 32
    jwtSigningKey: ""
    storageEncryptionKey: ""
    # Pre-created Secret holding OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, and
    # optionally OIDC_JWT_SIGNING_KEY and OIDC_STORAGE_ENCRYPTION_KEY.
    # Supply either this or the inline values above, not both.
    existingSecret: ""

nodeSelector: {}
tolerations: []
affinity: {}
