**High: these break the main use case**
1. **One missing branch blocks every backport.** If a PR is labelled for two lines and only one `release/X.Y` branch exists, `backport.yml`'s resolver calls `core.setFailed()`. That skips the backport step for the branch that does exist too. The PR comment only names the missing branch, so the other line looks done when it isn't.
2. **The documented setup for a new release branch can't produce a release.** `release.md` only copies `release.yml` and `ci.yml` from `main`. But `release.yml` also calls `sbom.yml` and `integrations-ci-cd-kicker.yaml` as reusable workflows, and at `v0.17.1` neither of those supports being called that way (no `workflow_call` trigger). The run would fail before any job starts. The fix is to add both files to the `git checkout main --` list in the doc.
3. **The downstream release notice doesn't know it's a backport.** `notify-integration-ci-cd` sends the tag to `kubecost/integration-ci-cd` without checking `is_backport`. If that repo treats the tag as the newest release, a 0.17.x patch could move consumers back from 0.18.x. Every other publish path in the PR already guards against this.

**Medium**
- A `v0.18` label silently does nothing right after `release/0.18` is cut, because it's compared against `main`'s `pyproject.toml` version. The run logs it, but no comment is posted on the PR.
- The Dependabot exemption checks `github.actor`, so it stops applying as soon as a person labels or pushes to the PR. It should check `pull_request.user.login`.
- `require-version-label.yml` has no `concurrency` group, so a stale failing run can finish after a passing one.
- The label check doesn't block merges until the repo's branch rules require it, and the `ci-only` label needs to exist first.
- No `actionlint` runs in CI, and the new event paths have no tests.
