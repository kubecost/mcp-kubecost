[project]
name = "mcp-kubecost"
version = "0.6.2"
description = "FinOps-first MCP server for Kubecost analytics."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=3.4.7",
  "httpx>=0.28.1",
  "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
# Tracing is opt-in: the Docker image installs this extra, plain installs do not.
# The 0.x "b0" versions are not a maturity signal — OpenTelemetry Python versions
# every instrumentation package on a permanent prerelease track (see its
# RELEASING.md), and stable opentelemetry-sdk itself pins
# opentelemetry-semantic-conventions==0.65b0. There is no non-beta alternative.
otel = [
  "opentelemetry-distro[otlp]>=0.65b0",
  "opentelemetry-instrumentation-httpx>=0.65b0",
  "opentelemetry-instrumentation-starlette>=0.65b0",
]
dev = [
  "pyrefly",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-httpx",
  "ruff",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[project.scripts]
mcp-kubecost = "mcp_kubecost.server:main"
mcp-kubecost-http = "mcp_kubecost.otel_entrypoint:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
  "integration: requires a live kubecost api endpoint (deselected by default)",
]

[tool.coverage.run]
source = ["mcp_kubecost"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_kubecost"]
combine-as-imports = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Pyrefly is the project's type checker — the one CI and agents run.
[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "."]
python-version = "3.12"


# basedpyright here for for IDEs without Pyrefly language-server support. Not an enforced gate;
# if the two ever disagree, Pyrefly wins.
[tool.basedpyright]
typeCheckingMode = "basic"
reportUnknownVariableType = "none"
reportAny = "none"
reportExplicitAny = "none"
reportAttributeAccessIssue = "none"
