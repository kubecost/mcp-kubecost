[project]
name = "mcp-kubecost"
version = "0.1.0"
description = "FinOps-first MCP server for Kubecost analytics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=3.4.0,<4",
  "httpx>=0.28.1",
  "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-httpx>=0.35",
  "ruff",
]

[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project.scripts]
mcp-kubecost = "mcp_kubecost.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_kubecost"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
  "integration: requires a live Kubecost endpoint (deselected by default)",
]

[tool.coverage.run]
source = ["mcp_kubecost"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_kubecost"]
combine-as-imports = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
