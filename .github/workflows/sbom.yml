name: Generate SBOM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., v1.0.0 or 1.0.0)'
        required: false
        type: string
  # release.yml calls this after creating the release: its tag is made with
  # GITHUB_TOKEN, which does not fire the `push: tags` trigger above.
  # github.event_name is the caller's (workflow_dispatch) when called.
  workflow_call:
    inputs:
      release_version:
        description: 'Release version (e.g., v1.0.0 or 1.0.0)'
        required: false
        type: string
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Dockerfile'
      - 'config/fastmcp-http.json'

# Include the requested version so a manual dispatch on main cannot cancel the
# SBOM run that release.yml calls (both have github.ref == refs/heads/main).
concurrency:
  group: sbom-${{ github.ref }}-${{ inputs.release_version }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        # Values go through env, not inline expressions: release_version is free text.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          # Branch on the input, not the event: under workflow_call event_name is
          # the caller's. The input is only ever set by dispatch or workflow_call.
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "$EVENT_NAME" == "push" && "$REF" == refs/tags/* ]]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="dev"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  scan-spdx:
    runs-on: ubuntu-latest
    needs: determine-version
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run Trivy filesystem scan (SPDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          format: 'spdx-json'
          output: 'mcp-kubecost-source-sbom.spdx.json'
      - name: Upload SPDX artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sbom-spdx
          path: mcp-kubecost-source-sbom.spdx.json

  scan-cyclonedx:
    runs-on: ubuntu-latest
    needs: determine-version
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run Trivy filesystem scan (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: 'mcp-kubecost-source-sbom.cyclonedx.json'
      - name: Upload CycloneDX artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sbom-cyclonedx
          path: mcp-kubecost-source-sbom.cyclonedx.json

  publish-sbom:
    runs-on: ubuntu-latest
    needs: [determine-version, scan-spdx, scan-cyclonedx]
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - name: Download SPDX artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: sbom-spdx

      - name: Download CycloneDX artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: sbom-cyclonedx

      - name: Display SBOM contents in step summary
        if: github.event_name == 'pull_request'
        run: |
          echo "## SBOM Contents (SPDX Format)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Package Count" >> "$GITHUB_STEP_SUMMARY"
          PACKAGE_COUNT=$(jq '.packages | length' mcp-kubecost-source-sbom.spdx.json)
          echo "Total packages: $PACKAGE_COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Top-level Packages" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.packages[] | select(.name != null) | "\(.name) - \(.versionInfo // "unknown")"' \
            mcp-kubecost-source-sbom.spdx.json | head -50 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Attach SBOM to release
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # This job has no checkout, so gh cannot infer the repo from a git remote.
          GH_REPO: ${{ github.repository }}
          # Under workflow_call event_name is the caller's (workflow_dispatch), so
          # this resolves to v<release_version without v>, e.g. v0.18.0.
          TAG_NAME: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', env.VERSION) }}
        run: |
          files=(mcp-kubecost-source-sbom.spdx.json mcp-kubecost-source-sbom.cyclonedx.json)
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${files[@]}" --clobber
          else
            gh release create "${TAG_NAME}" "${files[@]}"
          fi

      - name: Add workflow summary
        run: |
          echo "## SBOM Generation Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${{ env.VERSION }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Event:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Generated Files:" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`mcp-kubecost-source-sbom.spdx.json\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`mcp-kubecost-source-sbom.cyclonedx.json\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "✅ SBOM files attached to release" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ SBOM contents displayed in step summary above" >> "$GITHUB_STEP_SUMMARY"
          fi
