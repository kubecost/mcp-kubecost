name: integration-ci-cd trigger

on:
  push:
    tags:
      - "v*"
  # release.yml calls this after publishing: its tag is created with
  # GITHUB_TOKEN, which does not fire the `push: tags` trigger above.
  workflow_call:
    inputs:
      tag:
        description: "Release tag to announce, as github.ref_name would be on a tag push (e.g. v0.18.0)."
        required: true
        type: string
    secrets:
      KC_ACTIONS_BOT_APP_PRIVATE_KEY:
        required: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name:
          Generate app token with permissions to dispatch to integration-ci-cd
        id: generate-app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.KC_ACTIONS_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.KC_ACTIONS_BOT_APP_PRIVATE_KEY }}
          repositories: integration-ci-cd

      - name: Trigger repository dispatch
        env:
          GH_TOKEN: ${{ steps.generate-app-token.outputs.token }}
          # inputs.tag when called from release.yml; the pushed tag otherwise.
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          jq -n --arg tag "$TAG" \
            '{event_type: "mcp-kubecost-release", client_payload: {tag: $tag}}' \
            | gh api repos/kubecost/integration-ci-cd/dispatches --input -
