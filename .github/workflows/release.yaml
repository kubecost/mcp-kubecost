name: release pipeline

on:
  workflow_dispatch:
    inputs:
      bump-level:
        description: "Is this a major/minor/patch? Breaking changes should be a minor bump. Fixes are patches."
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: "Mark this release as a pre-release."
        required: false
        type: boolean
        default: false
      notes:
        description: "Optional extra release notes (prepended to auto-generated changelog)."
        required: false
        type: string
        default: ""

permissions:
  contents: write   # required for creating the GitHub Release and pushing to gh-pages

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      chart_version: ${{ steps.id.outputs.py_version }}
      release_tag: ${{ steps.id.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked --all-extras

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          uv version --bump ${{ inputs.bump-level }}
          PY_VERSION=$(uv version --short)

          # Keep manifest.json in lockstep with pyproject.toml.
          if [ -f manifest.json ]; then
            jq --arg v "$PY_VERSION" '.version = $v' manifest.json > manifest.json.tmp
            mv manifest.json.tmp manifest.json
          else
            echo "::warning::manifest.json not found — skipping version sync."
          fi

          # Keep Chart.yaml version + appVersion in lockstep with pyproject.toml.
          CHART_FILE="charts/mcp-kubecost/Chart.yaml"
          if [ -f "$CHART_FILE" ]; then
            sed -i "s|^version:.*|version: ${PY_VERSION}|" "$CHART_FILE"
            sed -i "s|^appVersion:.*|appVersion: \"${PY_VERSION}\"|" "$CHART_FILE"
            echo "Updated $CHART_FILE version and appVersion to $PY_VERSION"
          fi

          git config user.name "github-app-commit[bot]"
          git config user.email "github-app-commit[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          if [ -f manifest.json ]; then git add manifest.json; fi
          if [ -f "$CHART_FILE" ]; then git add "$CHART_FILE"; fi
          git commit -m "chore: bump version to v${PY_VERSION}"
          git push

      - name: Compute identifiers
        id: id
        run: |
          set -euo pipefail
          PY_VERSION=$(uv version --short)
          TS=$(date -u +'%Y%m%d-%H%M%S')
          SHORT_SHA=${GITHUB_SHA::7}
          ARTIFACT_NAME="mcp-kubecost-${PY_VERSION}-${TS}-${SHORT_SHA}"

          # FIXED: inputs.version does not exist as a workflow input — it was always
          # empty, producing RELEASE_TAG="v" and breaking every dispatch release.
          # Derive the tag from PY_VERSION instead (already computed above).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="v${PY_VERSION}"
          else
            RELEASE_TAG=""
          fi

          echo "py_version=$PY_VERSION"       >> "$GITHUB_OUTPUT"
          echo "ts=$TS"                       >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA"         >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG"     >> "$GITHUB_OUTPUT"

      - name: Verify release tag is unused
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.id.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists. Bump the version input and re-run."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Git tag ${TAG} already exists. Bump the version input and re-run."
            exit 1
          fi
          echo "Tag ${TAG} is available."

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Build wheel + sdist
        run: uv build

      - name: Package Helm chart
        run: helm package charts/mcp-kubecost --destination dist/

      - name: Bundle source archive
        run: |
          set -euo pipefail
          git archive --format=tar.gz \
            --prefix=${{ steps.id.outputs.artifact_name }}/ \
            -o dist/${{ steps.id.outputs.artifact_name }}-source.tar.gz HEAD

      - name: Stage installer (if present)
        run: |
          set -euo pipefail
          if [ -f install.sh ]; then
            cp install.sh dist/install.sh
            chmod +x dist/install.sh
            echo "Installer staged at dist/install.sh"
          else
            echo "No ./install.sh yet — skipping."
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.id.outputs.artifact_name }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.id.outputs.release_tag }}
          EXTRA_NOTES: ${{ inputs.notes }}
          PRERELEASE_FLAG: ${{ inputs.prerelease && '--prerelease' || '' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No files in dist/ to attach to the release."
            exit 1
          fi
          if [ -n "$EXTRA_NOTES" ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "$EXTRA_NOTES" \
              --generate-notes \
              $PRERELEASE_FLAG \
              "${files[@]}"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              $PRERELEASE_FLAG \
              "${files[@]}"
          fi

  publish-image:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/kubecost/mcp-kubecost:${{ needs.build.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.release_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kubecost/mcp-kubecost
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.build.outputs.release_tag }}
            type=raw,value=${{ needs.build.outputs.chart_version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-copy:
    needs: [build, publish-image]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token for cross-repo dispatch
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.KC_ACTIONS_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.KC_ACTIONS_BOT_APP_PRIVATE_KEY }}
          owner: apptio-pne
          repositories: kubecost-deploy

      - name: Trigger Harbor and ICR copy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DOCKER_IMAGE: ${{ needs.publish-image.outputs.image }}
        run: |
          set -euo pipefail
          gh workflow run "Copy Cloudy Images to Harbor and ICR" \
            --repo apptio-pne/kubecost-deploy \
            --ref main \
            -f docker_image="${DOCKER_IMAGE}" \
            -f is_release=true \
            -f set_latest=true

      - name: Image path summary
        env:
          DOCKER_IMAGE: ${{ needs.publish-image.outputs.image }}
        run: |
          set -euo pipefail
          IMAGE_NAME=$(echo "${DOCKER_IMAGE}" | rev | cut -d '/' -f1 | rev)
          echo "## Container Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Registry | Image |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| GHCR | \`${DOCKER_IMAGE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Harbor release (pending) | \`kubecost/releases/${IMAGE_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ICR (pending scan) | \`ibm-finops/${IMAGE_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"

  update-helm-index:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          ref: gh-pages
          path: gh-pages

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Download chart tarball from release
        env:
          GH_TOKEN: ${{ github.token }}
          CHART_VERSION: ${{ needs.build.outputs.chart_version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/chart-tgz
          gh release download "v${CHART_VERSION}" \
            --repo kubecost/mcp-kubecost \
            --pattern "mcp-kubecost-${CHART_VERSION}.tgz" \
            --dir /tmp/chart-tgz

      - name: Update index.yaml
        env:
          CHART_VERSION: ${{ needs.build.outputs.chart_version }}
        run: |
          set -euo pipefail
          helm repo index /tmp/chart-tgz \
            --url "https://github.com/kubecost/mcp-kubecost/releases/download/v${CHART_VERSION}/" \
            --merge gh-pages/index.yaml
          cp /tmp/chart-tgz/index.yaml gh-pages/index.yaml

      - name: Commit and push index.yaml to gh-pages
        env:
          CHART_VERSION: ${{ needs.build.outputs.chart_version }}
        run: |
          set -euo pipefail
          cd gh-pages
          git config user.name "github-app-commit[bot]"
          git config user.email "github-app-commit[bot]@users.noreply.github.com"
          git add index.yaml
          git commit -m "chore: add mcp-kubecost v${CHART_VERSION} to helm index"
          git push
