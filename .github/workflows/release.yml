name: release pipeline

on:
  workflow_dispatch:
    inputs:
      bump-level:
        description: "Is this a major/minor/patch? Breaking changes should be a minor bump. Fixes are patches."
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: "Mark this release as a pre-release."
        required: false
        type: boolean
        default: false
      notes:
        description: "Optional extra release notes (prepended to auto-generated changelog)."
        required: false
        type: string
        default: ""

permissions:
  contents: write   # required for creating the GitHub Release and pushing to gh-pages

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      chart_version: ${{ steps.id.outputs.py_version }}
      release_tag: ${{ steps.id.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked --all-extras

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail

          # Derive the baseline from the latest git tag so that a failed/re-run
          # release doesn't double-bump the in-tree version. Strip the leading "v".
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -n "$LATEST_TAG" ]; then
            LATEST_VERSION="${LATEST_TAG#v}"
            echo "Resetting pyproject.toml to latest tag ${LATEST_TAG} before bumping."
            uv version "$LATEST_VERSION"
          else
            echo "No prior release tag found; bumping from current pyproject.toml version."
          fi

          uv version --bump ${{ inputs.bump-level }}
          PY_VERSION=$(uv version --short)

          # Keep manifest.json in lockstep with pyproject.toml.
          if [ -f manifest.json ]; then
            jq --arg v "$PY_VERSION" '.version = $v' manifest.json > manifest.json.tmp
            mv manifest.json.tmp manifest.json
          else
            echo "::warning::manifest.json not found — skipping version sync."
          fi

          # Keep Chart.yaml version + appVersion in lockstep with pyproject.toml.
          CHART_FILE="charts/mcp-kubecost/Chart.yaml"
          if [ -f "$CHART_FILE" ]; then
            sed -i "s|^version:.*|version: ${PY_VERSION}|" "$CHART_FILE"
            sed -i "s|^appVersion:.*|appVersion: \"${PY_VERSION}\"|" "$CHART_FILE"
            echo "Updated $CHART_FILE version and appVersion to $PY_VERSION"
          fi

          git config user.name "github-app-commit[bot]"
          git config user.email "github-app-commit[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          if [ -f manifest.json ]; then git add manifest.json; fi
          if [ -f "$CHART_FILE" ]; then git add "$CHART_FILE"; fi
          git commit -m "chore: bump version to v${PY_VERSION}"
          git push

      - name: Compute identifiers
        id: id
        run: |
          set -euo pipefail
          PY_VERSION=$(uv version --short)
          TS=$(date -u +'%Y%m%d-%H%M%S')
          SHORT_SHA=${GITHUB_SHA::7}
          ARTIFACT_NAME="mcp-kubecost-${PY_VERSION}-${TS}-${SHORT_SHA}"

          # FIXED: inputs.version does not exist as a workflow input — it was always
          # empty, producing RELEASE_TAG="v" and breaking every dispatch release.
          # Derive the tag from PY_VERSION instead (already computed above).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="v${PY_VERSION}"
          else
            RELEASE_TAG=""
          fi

          echo "py_version=$PY_VERSION"       >> "$GITHUB_OUTPUT"
          echo "ts=$TS"                       >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA"         >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG"     >> "$GITHUB_OUTPUT"

      - name: Verify release tag is unused
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.id.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists. Bump the version input and re-run."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Git tag ${TAG} already exists. Bump the version input and re-run."
            exit 1
          fi
          echo "Tag ${TAG} is available."

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Build wheel + sdist
        run: uv build

      - name: Package Helm chart
        run: helm package charts/mcp-kubecost --destination dist/

      - name: Bundle source archive
        run: |
          set -euo pipefail
          git archive --format=tar.gz \
            --prefix=${{ steps.id.outputs.artifact_name }}/ \
            -o dist/${{ steps.id.outputs.artifact_name }}-source.tar.gz HEAD

      - name: Stage installer (if present)
        run: |
          set -euo pipefail
          if [ -f install.sh ]; then
            cp install.sh dist/install.sh
            chmod +x dist/install.sh
            echo "Installer staged at dist/install.sh"
          else
            echo "No ./install.sh yet — skipping."
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.id.outputs.artifact_name }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.id.outputs.release_tag }}
          EXTRA_NOTES: ${{ inputs.notes }}
          PRERELEASE_FLAG: ${{ inputs.prerelease && '--prerelease' || '' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No files in dist/ to attach to the release."
            exit 1
          fi
          if [ -n "$EXTRA_NOTES" ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "$EXTRA_NOTES" \
              --generate-notes \
              $PRERELEASE_FLAG \
              "${files[@]}"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              $PRERELEASE_FLAG \
              "${files[@]}"
          fi

  publish-image:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: icr.io/kubecost/mcp-kubecost:${{ needs.build.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.release_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ICR
        uses: docker/login-action@v4
        with:
          registry: icr.io
          username: iamapikey
          password: ${{ secrets.IBM_CLOUD_API_KEY }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: icr.io/kubecost/mcp-kubecost
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.build.outputs.release_tag }}
            type=raw,value=${{ needs.build.outputs.chart_version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-helm-index:
    needs: [build, publish-image]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          ref: gh-pages
          path: gh-pages

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Download chart tarball from release
        env:
          GH_TOKEN: ${{ github.token }}
          CHART_VERSION: ${{ needs.build.outputs.chart_version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/chart-tgz
          gh release download "v${CHART_VERSION}" \
            --repo kubecost/mcp-kubecost \
            --pattern "mcp-kubecost-${CHART_VERSION}.tgz" \
            --dir /tmp/chart-tgz

      - name: Update index.yaml
        env:
          CHART_VERSION: ${{ needs.build.outputs.chart_version }}
        run: |
          set -euo pipefail
          helm repo index /tmp/chart-tgz \
            --url "https://github.com/kubecost/mcp-kubecost/releases/download/v${CHART_VERSION}/" \
            --merge gh-pages/index.yaml
          cp /tmp/chart-tgz/index.yaml gh-pages/index.yaml

      - name: Commit and push index.yaml to gh-pages
        env:
          CHART_VERSION: ${{ needs.build.outputs.chart_version }}
        run: |
          set -euo pipefail
          cd gh-pages
          git config user.name "github-app-commit[bot]"
          git config user.email "github-app-commit[bot]@users.noreply.github.com"
          git add index.yaml
          git commit -m "chore: add mcp-kubecost v${CHART_VERSION} to helm index"
          git push

  # Opens a PR against kubecost/kubecost that bumps the mcp-kubecost subchart to
  # the version just published. Runs only for real (non-prerelease) dispatches,
  # after the chart is downloadable from the Helm index.
  update-parent-chart:
    needs: [build, publish-image, update-helm-index]
    if: github.event_name == 'workflow_dispatch' && !inputs.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CHART_VERSION: ${{ needs.build.outputs.chart_version }}
      PARENT_REPO: kubecost/kubecost
      PARENT_BRANCH: develop
      PARENT_CHART_DIR: kubecost
      HELM_REPO_NAME: mcp-kubecost
      HELM_REPO_URL: https://kubecost.github.io/mcp-kubecost
    steps:
      # A GitHub App installation token is scoped to kubecost/kubecost and expires
      # in one hour, so no long-lived user PAT is stored in this repository.
      - name: Generate an app token with write access to the parent chart repo
        id: parent-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.KC_ACTIONS_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.KC_ACTIONS_BOT_APP_PRIVATE_KEY }}
          owner: kubecost
          repositories: kubecost

      - name: Check out the parent chart repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PARENT_REPO }}
          ref: ${{ env.PARENT_BRANCH }}
          path: parent
          token: ${{ steps.parent-token.outputs.token }}
          # Needed so the automation branch can be pushed back.
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      # ubuntu-latest ships yq, but pin it so the Chart.yaml edit below cannot
      # break when the runner image is updated.
      - name: Set up yq
        run: |
          set -euo pipefail
          YQ_VERSION=v4.53.4
          curl -fsSL -o /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      # gh-pages is served by GitHub Pages, which deploys asynchronously after
      # update-helm-index pushes index.yaml. Wait for the new version to be
      # resolvable before touching the parent chart.
      - name: Wait for the chart to appear in the Helm index
        run: |
          set -euo pipefail
          helm repo add "$HELM_REPO_NAME" "$HELM_REPO_URL"
          for attempt in $(seq 1 30); do
            helm repo update "$HELM_REPO_NAME" > /dev/null 2>&1 || true
            if helm search repo "${HELM_REPO_NAME}/mcp-kubecost" \
                 --version "$CHART_VERSION" --output json \
               | jq -e --arg v "$CHART_VERSION" 'any(.[]; .version == $v)' > /dev/null; then
              echo "mcp-kubecost ${CHART_VERSION} is published in ${HELM_REPO_URL}."
              exit 0
            fi
            echo "Attempt ${attempt}/30: mcp-kubecost ${CHART_VERSION} not in the index yet; retrying in 20s."
            sleep 20
          done
          echo "::error::mcp-kubecost ${CHART_VERSION} never appeared in ${HELM_REPO_URL} (waited 10 minutes)."
          exit 1

      - name: Pin the new subchart version and regenerate Chart.lock
        id: bump
        working-directory: parent
        run: |
          set -euo pipefail
          CHART_FILE="${PARENT_CHART_DIR}/Chart.yaml"

          CURRENT=$(yq -r \
            '.dependencies[] | select(.name == "mcp-kubecost") | .version // ""' \
            "$CHART_FILE")

          if [ -z "$CURRENT" ]; then
            echo "::error::${PARENT_REPO} ${CHART_FILE} has no mcp-kubecost dependency to bump."
            exit 1
          fi

          echo "Current pinned version: ${CURRENT}"
          echo "Released version:       ${CHART_VERSION}"

          if [ "$CURRENT" = "$CHART_VERSION" ]; then
            echo "Parent chart already pins ${CHART_VERSION}; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Rewrite only the version line of the mcp-kubecost dependency. `yq -i`
          # would reformat the whole document, and its one-space inline comment
          # style fails the `ct lint` yamllint config used by kubecost/kubecost.
          awk -v newVersion="$CHART_VERSION" '
            $0 ~ /^[[:space:]]*-[[:space:]]+name:[[:space:]]*mcp-kubecost[[:space:]]*$/ { found = 1 }
            found && $0 ~ /^[[:space:]]*version:/ {
              match($0, /^[[:space:]]*/)
              printf "%sversion: \"%s\"\n", substr($0, 1, RLENGTH), newVersion
              found = 0
              next
            }
            { print }
          ' "$CHART_FILE" > "${CHART_FILE}.tmp"
          mv "${CHART_FILE}.tmp" "$CHART_FILE"

          # The awk edit is line-based, so confirm it produced the intended
          # semantic change and touched exactly one line.
          APPLIED=$(yq -r \
            '.dependencies[] | select(.name == "mcp-kubecost") | .version // ""' \
            "$CHART_FILE")
          if [ "$APPLIED" != "$CHART_VERSION" ]; then
            echo "::error::Failed to pin mcp-kubecost to ${CHART_VERSION} (Chart.yaml still reads '${APPLIED}')."
            exit 1
          fi

          NUMSTAT=$(git diff --numstat -- "$CHART_FILE" | awk '{print $1"/"$2}')
          if [ "$NUMSTAT" != "1/1" ]; then
            echo "::error::Expected exactly one changed line in ${CHART_FILE}, got added/removed = ${NUMSTAT}."
            git diff -- "$CHART_FILE"
            exit 1
          fi

          # Regenerate Chart.lock for every dependency the parent chart declares.
          helm repo add finops-agent-chart https://kubecost.github.io/finops-agent-chart
          helm repo update > /dev/null
          helm dependency update "$PARENT_CHART_DIR"

          echo "previous=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "changed=true"        >> "$GITHUB_OUTPUT"

      # Never open a PR that would break the parent chart. This mirrors the
      # kubecost repo's own validate-mcp-subchart workflow.
      - name: Verify the parent chart still renders with the subchart enabled
        if: steps.bump.outputs.changed == 'true'
        working-directory: parent
        run: |
          set -euo pipefail
          # The mcp-kubecost dependency is aliased as "mcp" in kubecost/Chart.yaml,
          # so the values key is "mcp.*", not "mcp-kubecost.*".
          # mcp.enabled defaults to true in the parent chart's values.yaml, so the
          # plain render (subchart disabled) just needs --skip-schema-validation.
          #
          # --skip-schema-validation is required because mcp-kubecost's
          # values.schema.json uses additionalProperties: false and does not declare
          # the `enabled` field that Helm injects from the Chart.yaml condition.
          helm lint "$PARENT_CHART_DIR" --skip-schema-validation --set 'mcp.enabled=true'
          helm template kubecost "$PARENT_CHART_DIR" \
            --skip-schema-validation \
            --set 'global.platforms.cicd.enabled=true' \
            --set 'global.platforms.cicd.skipSanityChecks=true' \
            > /dev/null
          helm template kubecost "$PARENT_CHART_DIR" \
            --skip-schema-validation \
            --set 'mcp.enabled=true' \
            --set 'global.platforms.cicd.enabled=true' \
            --set 'global.platforms.cicd.skipSanityChecks=true' \
            > /tmp/parent-render.yaml
          grep -q "kind: Deployment" /tmp/parent-render.yaml
          grep -q "charts/mcp/templates/deployment.yaml" /tmp/parent-render.yaml
          grep -q "image: \"icr.io/kubecost/mcp-kubecost:${CHART_VERSION}\"" /tmp/parent-render.yaml
          echo "Parent chart renders mcp-kubecost ${CHART_VERSION}."

      - name: Diff mcp-kubecost values.yaml between versions
        if: steps.bump.outputs.changed == 'true'
        id: values-diff
        run: |
          set -euo pipefail
          mkdir -p /tmp/mcp-values-diff

          # Fetch the current pinned version live from the develop branch of the
          # parent chart repo, so the diff is always against what is on develop
          # right now — not the stale checked-out state.
          PARENT_CHART_YAML_URL="https://raw.githubusercontent.com/${PARENT_REPO}/refs/heads/${PARENT_BRANCH}/${PARENT_CHART_DIR}/Chart.yaml"
          PREVIOUS_VERSION=$(curl -fsSL "$PARENT_CHART_YAML_URL" \
            | yq -r '.dependencies[] | select(.name == "mcp-kubecost") | .version // ""')
          if [ -z "$PREVIOUS_VERSION" ]; then
            echo "::warning::Could not determine current mcp-kubecost version from ${PARENT_CHART_YAML_URL}; skipping diff."
            echo "values_diff_body=Could not determine previous version from \`${PARENT_CHART_YAML_URL}\`; diff unavailable." \
              >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Previous version (from ${PARENT_REPO}/${PARENT_BRANCH}): ${PREVIOUS_VERSION}"
          echo "previous_version=${PREVIOUS_VERSION}" >> "$GITHUB_OUTPUT"

          # Pull both chart tarballs; the repo was already added by the "Wait" step.
          helm pull "${HELM_REPO_NAME}/mcp-kubecost" --version "${PREVIOUS_VERSION}" \
            --destination /tmp/mcp-values-diff
          helm pull "${HELM_REPO_NAME}/mcp-kubecost" --version "${CHART_VERSION}" \
            --destination /tmp/mcp-values-diff

          tar -xzf "/tmp/mcp-values-diff/mcp-kubecost-${PREVIOUS_VERSION}.tgz" \
            -C /tmp/mcp-values-diff --strip-components=1 mcp-kubecost/values.yaml
          mv /tmp/mcp-values-diff/values.yaml /tmp/mcp-values-diff/values-prev.yaml

          tar -xzf "/tmp/mcp-values-diff/mcp-kubecost-${CHART_VERSION}.tgz" \
            -C /tmp/mcp-values-diff --strip-components=1 mcp-kubecost/values.yaml
          mv /tmp/mcp-values-diff/values.yaml /tmp/mcp-values-diff/values-new.yaml

          DIFF=$(diff -u \
            --label "values.yaml (${PREVIOUS_VERSION})" \
            --label "values.yaml (${CHART_VERSION})" \
            /tmp/mcp-values-diff/values-prev.yaml \
            /tmp/mcp-values-diff/values-new.yaml || true)

          if [ -z "$DIFF" ]; then
            echo "values_diff_body=No changes to \`values.yaml\` between \`${PREVIOUS_VERSION}\` and \`${CHART_VERSION}\`." \
              >> "$GITHUB_OUTPUT"
          else
            # Write the diff to a temp file so it survives newlines in GITHUB_OUTPUT.
            echo "$DIFF" > /tmp/mcp-values-diff/values.diff
            # Encode as a multiline GITHUB_OUTPUT value.
            {
              echo "values_diff_body<<VALUES_DIFF_EOF"
              printf '```diff\n'
              cat /tmp/mcp-values-diff/values.diff
              printf '```\n'
              echo "VALUES_DIFF_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Commit, push, and open the pull request
        if: steps.bump.outputs.changed == 'true'
        working-directory: parent
        env:
          GH_TOKEN: ${{ steps.parent-token.outputs.token }}
          PREVIOUS_VERSION: ${{ steps.values-diff.outputs.previous_version }}
          VALUES_DIFF_BODY: ${{ steps.values-diff.outputs.values_diff_body }}
        run: |
          set -euo pipefail
          BRANCH_PREFIX="automation/mcp-kubecost-${CHART_VERSION}"

          # An open PR whose branch is keyed to this version means the bump was
          # already proposed. Leave it alone rather than pushing over review commits.
          EXISTING=$(gh pr list --state open --json number,headRefName \
            --jq "[.[] | select(.headRefName | startswith(\"${BRANCH_PREFIX}\"))][0].number // \"\"")
          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} already proposes mcp-kubecost ${CHART_VERSION}; skipping."
            exit 0
          fi

          # If a stale branch from an abandoned run exists, add the run id rather
          # than overwriting someone else's history.
          BRANCH="$BRANCH_PREFIX"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            BRANCH="${BRANCH_PREFIX}-${GITHUB_RUN_ID}"
            echo "${BRANCH_PREFIX} already exists on the remote; using ${BRANCH}."
          fi

          git config user.name "github-app-commit[bot]"
          git config user.email "github-app-commit[bot]@users.noreply.github.com"

          git switch -c "$BRANCH"
          git add "${PARENT_CHART_DIR}/Chart.yaml" "${PARENT_CHART_DIR}/Chart.lock"
          git commit -m "chore(deps): bump mcp-kubecost subchart to ${CHART_VERSION}"
          git push --set-upstream origin "$BRANCH"

          # Backticks are escaped so the unquoted heredoc does not run them as
          # command substitutions.
          BODY_FILE="$(mktemp)"
          cat > "$BODY_FILE" <<EOF
          ## Summary

          Bumps the \`mcp-kubecost\` subchart dependency from \`${PREVIOUS_VERSION}\` to \`${CHART_VERSION}\`.

          Opened automatically by the [mcp-kubecost release pipeline](https://github.com/kubecost/mcp-kubecost/actions/runs/${GITHUB_RUN_ID}).

          Please review the below mcp-kubecost helm values.yaml changes and update the mcp: values of this chart as needed.
          Note: not all keys from the subchart need to be included in this parent chart.

          ## \`values.yaml\` diff (${PREVIOUS_VERSION} → ${CHART_VERSION})

          ${VALUES_DIFF_BODY}

          ## Changes

          - \`${PARENT_CHART_DIR}/Chart.yaml\`: \`dependencies[mcp-kubecost].version\` -> \`${CHART_VERSION}\`
          - \`${PARENT_CHART_DIR}/Chart.lock\`: regenerated with \`helm dependency update\`

          ## Validation performed by the release pipeline

          - \`helm dependency update ${PARENT_CHART_DIR}\`
          - \`helm lint ${PARENT_CHART_DIR} --skip-schema-validation --set 'mcp.enabled=true'\`
          - \`helm template kubecost ${PARENT_CHART_DIR} --skip-schema-validation --set 'global.platforms.cicd.enabled=true' --set 'global.platforms.cicd.skipSanityChecks=true'\` (subchart enabled by default)
          - \`helm template kubecost ${PARENT_CHART_DIR} --skip-schema-validation --set 'mcp.enabled=true' --set 'global.platforms.cicd.enabled=true' --set 'global.platforms.cicd.skipSanityChecks=true'\`
            renders \`icr.io/kubecost/mcp-kubecost:${CHART_VERSION}\`

          ## Notes

          - Release notes: https://github.com/kubecost/mcp-kubecost/releases/tag/v${CHART_VERSION}
          EOF

          gh pr create \
            --base "$PARENT_BRANCH" \
            --head "$BRANCH" \
            --title "chore(deps): bump mcp-kubecost subchart to ${CHART_VERSION}" \
            --body-file "$BODY_FILE" \
            --label dependencies

          {
            echo "### Parent chart PR"
            gh pr view "$BRANCH" --json url --jq .url
          } >> "$GITHUB_STEP_SUMMARY"
