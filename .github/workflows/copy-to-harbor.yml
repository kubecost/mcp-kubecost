name: Copy to Harbor

# Promote an mcp-kubecost image already on ICR into Harbor.
# Non-release runs land under kubecost/mcp-kubecost:<tag>.
# Release runs additionally write the immutable copy to
# kubecost/releases/mcp-kubecost:<tag>.
#
# Typical usage:
#   docker_image: icr.io/kubecost/mcp-kubecost:v0.5.0
#   is_release:   true   (adds kubecost/releases/mcp-kubecost:v0.5.0)
#   set_latest:   true   (only for non-backport releases)

on:
  workflow_dispatch:
    inputs:
      docker_image:
        description: 'Full ICR image path and tag to copy (e.g., icr.io/kubecost/mcp-kubecost:v0.5.0)'
        type: string
        required: true
      dry_run:
        description: 'Show what would be copied without actually copying'
        type: boolean
        required: false
        default: false
      is_release:
        description: 'Also push to kubecost/releases/mcp-kubecost (immutable release path)'
        type: boolean
        required: false
        default: false
      set_latest:
        description: 'Tag as latest in Harbor (skip for backport releases)'
        type: boolean
        required: false
        default: false

jobs:
  copy-to-harbor:
    runs-on: gha-org-apptio-pne-eng
    outputs:
      image_tag: ${{ steps.set-image.outputs.image_tag }}
    steps:
      - name: Log in to Harbor
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ secrets.HARBOR_ADDR }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Install crane
        uses: Apptio-PNE/crane-installer@v4

      - name: Extract image tag
        id: set-image
        run: |
          IMAGE_TAG=$(echo "${{ inputs.docker_image }}" | sed 's/.*://')
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Copy to Harbor
        if: ${{ !inputs.dry_run }}
        run: |
          IMAGE_TAG="${{ steps.set-image.outputs.image_tag }}"
          HARBOR_IMAGE="${{ secrets.HARBOR_ADDR }}/kubecost/mcp-kubecost:${IMAGE_TAG}"

          echo "Copying ${{ inputs.docker_image }} → ${HARBOR_IMAGE}"
          crane copy --insecure "${{ inputs.docker_image }}" "${HARBOR_IMAGE}"
          echo "Main image copy completed successfully"

          if [[ "${{ inputs.set_latest }}" == "true" ]]; then
            LATEST="${{ secrets.HARBOR_ADDR }}/kubecost/mcp-kubecost:latest"
            echo "Tagging as latest: ${LATEST}"
            crane copy --insecure "${{ inputs.docker_image }}" "${LATEST}"
            echo "Latest tag copy completed successfully"
          fi

          if [[ "${{ inputs.is_release }}" == "true" ]]; then
            RELEASE_IMAGE="${{ secrets.HARBOR_ADDR }}/kubecost/releases/mcp-kubecost:${IMAGE_TAG}"
            echo "Copying to release path: ${RELEASE_IMAGE}"
            crane copy --insecure "${{ inputs.docker_image }}" "${RELEASE_IMAGE}"
            echo "Release image copy completed successfully"
          fi

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          IMAGE_TAG="${{ steps.set-image.outputs.image_tag }}"
          echo "=== DRY RUN — no images copied ==="
          echo "Source:  ${{ inputs.docker_image }}"
          echo "Harbor:  ${{ secrets.HARBOR_ADDR }}/kubecost/mcp-kubecost:${IMAGE_TAG}"
          if [[ "${{ inputs.set_latest }}" == "true" ]]; then
            echo "Latest:  ${{ secrets.HARBOR_ADDR }}/kubecost/mcp-kubecost:latest"
          fi
          if [[ "${{ inputs.is_release }}" == "true" ]]; then
            echo "Release: ${{ secrets.HARBOR_ADDR }}/kubecost/releases/mcp-kubecost:${IMAGE_TAG}"
          fi

      - name: Summary
        run: |
          IMAGE_TAG="${{ steps.set-image.outputs.image_tag }}"
          echo "=== Copy to Harbor summary ==="
          echo "Source:  ${{ inputs.docker_image }}"
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "DRY RUN — no copies were made"
          else
            echo "Harbor:  ${{ secrets.HARBOR_ADDR }}/kubecost/mcp-kubecost:${IMAGE_TAG}"
            if [[ "${{ inputs.set_latest }}" == "true" ]]; then
              echo "Latest:  ${{ secrets.HARBOR_ADDR }}/kubecost/mcp-kubecost:latest"
            fi
            if [[ "${{ inputs.is_release }}" == "true" ]]; then
              echo "Release: ${{ secrets.HARBOR_ADDR }}/kubecost/releases/mcp-kubecost:${IMAGE_TAG}"
            fi
          fi

  twistlock-scan:
    needs: [copy-to-harbor]
    if: ${{ !inputs.dry_run }}
    uses: Apptio-PNE/gh-compliance-workflows/.github/workflows/twistlock-scan.yaml@twistlock-scan/v1
    with:
      product_id: prd0013090  # Cloudy Product ID — same as kubecost images
      image: docker.apps.papt.to/kubecost/mcp-kubecost:${{ needs.copy-to-harbor.outputs.image_tag }}
      scan_type: ${{ inputs.is_release == true && 'prod' || 'nonprod' }}
