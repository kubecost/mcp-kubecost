name: 'Check spelling'
on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spellcheck: # run the action
    runs-on: Kubecost-Linux-Small-x86
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.KC_ACTIONS_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.KC_ACTIONS_BOT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }},github-actions

      - name: Check out this repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out actions code
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        uses: actions/checkout@v7
        with:
          repository: kubecost/github-actions
          path: ./github-actions
          ref: main
          token: ${{ steps.generate-token.outputs.token }}

      - uses: ./github-actions/cspell-action
        with:
          root: '.'
          config: './.github/cspell.json'
          verbose: true
          incremental_files_only: true
          files: |
            DEVELOPMENT.md
            README.md
            docs/
            src/mcp_kubecost/tools/**
            src/mcp_kubecost/skills/**
            src/mcp_kubecost/prompts/**
            src/mcp_kubecost/domain/kubecost/**
            charts/mcp-kubecost/README.md
            charts/mcp-kubecost/Chart.yaml
            charts/mcp-kubecost/values.yaml
            charts/mcp-kubecost/values.schema.json
            charts/mcp-kubecost/templates/**
