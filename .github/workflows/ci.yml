name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Import order check
        run: uv run isort . --check-only
      - name: Tests
        env:
          KUBECOST_BASE_URL: https://demo.kubecost.xyz
        run: uv run pytest --cov=mcp_kubecost --cov-report=xml -m "not integration"
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
      - name: Repo safety checks
        run: uv run python scripts/check_repo_safety.py
