name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  # release.yml calls this as its test gate.
  workflow_call:

# When called, github.workflow is the caller's name ("release pipeline"), so the
# group never matches release.yml's own "release" group or a standalone ci run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Type check
        run: uv run pyrefly check
      - name: Dead-code scan
        run: uv run vulture
      - name: Consent-screen branding
        run: uv run scripts/check_consent_branding.py --check
      - name: Tests
        env:
          KUBECOST_BASE_URL: https://demo.kubecost.xyz
          # Integration tests default to .agents/mcp.json (localhost). CI has no
          # local Kubecost; use the same public-demo config as the integration job.
          MCP_KUBECOST_TARGET: tests/mcp-demo.json
        run: uv run pytest --cov=mcp_kubecost --cov-report=xml -m ""
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
      - name: Repo safety checks
        run: uv run python scripts/pre_commit_hooks/check_repo_safety.py

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MCP_KUBECOST_CONFIG: tests/mcp-demo.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Check the target instance is reachable
        run: |
          set -euo pipefail
          URL=$(jq -r '.mcpServers["mcp-kubecost"].env.KUBECOST_BASE_URL' "$MCP_KUBECOST_CONFIG")
          echo "Integration target: $URL"
          echo "Integration target: $URL" >> "$GITHUB_STEP_SUMMARY"
          if ! curl -fsS --retry 3 --retry-delay 5 --max-time 30 -o /dev/null \
              "$URL/model/allocation?window=1d&aggregate=cluster&accumulate=true"; then
            echo "::error::$URL is not responding — integration tests cannot run against it."
            exit 1
          fi
      - name: Integration tests
        run: uv run pytest -m integration -v
