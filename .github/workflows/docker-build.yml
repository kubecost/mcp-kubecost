name: Docker build

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'config/fastmcp-http.json'
      - 'pyproject.toml'
      - 'uv.lock'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'config/fastmcp-http.json'
      - 'pyproject.toml'
      - 'uv.lock'

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ICR
        if: github.repository == 'kubecost/mcp-kubecost'
        uses: docker/login-action@v4
        with:
          registry: icr.io
          username: iamapikey
          password: ${{ secrets.IBM_CLOUD_API_KEY }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: icr.io/kubecost/mcp-kubecost
          tags: |
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-
            type=sha,prefix=sha-

      - name: Build and push to ICR
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.repository == 'kubecost/mcp-kubecost' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image path summary
        if: github.event_name == 'push' && github.repository == 'kubecost/mcp-kubecost'
        run: |
          set -euo pipefail
          echo "## Container Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            echo "- \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Comment image digest on PR
        if: github.event_name == 'pull_request' && github.repository == 'kubecost/mcp-kubecost'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        uses: actions/github-script@v9
        with:
          script: |
            const digest = process.env.DIGEST;
            const image = 'icr.io/kubecost/mcp-kubecost';
            const shaTag = process.env.TAGS.split('\n').find(t => t.includes('sha-')) || '';
            const body = [
              '### 🐳 Docker image pushed',
              '',
              `**Image:** \`${shaTag || image + '@' + digest}\``,
              digest ? `**Digest:** \`${image}@${digest}\`` : '',
            ].filter(Boolean).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
