# Intent
# ------
# Build whenever a file that ends up in the image changes, and publish an image for
# every build that can authenticate to the registry. Reviewers get a deployable
# `pr-<n>` tag commented on the PR; `main` gets its branch and `sha-` tags.
#
# The `paths` filters below are the set of build inputs the Dockerfile actually
# consumes (src/, config/fastmcp-http.json, pyproject.toml, uv.lock, README.md via
# the uv sync bind mount) plus the things that change how it is built (Dockerfile,
# .dockerignore, this workflow). Keep them in sync with the Dockerfile — GitHub
# Actions does not support YAML anchors, so the two lists must be edited together.
#
# Fork PRs are the one case that cannot publish: GitHub withholds secrets from them,
# so `docker login` has nothing to use. Those runs build only, which still catches a
# broken Dockerfile in review. The PUBLISH job env below is the single gate for
# login, push, and the PR comment — do not re-derive it per step, or the three will
# drift and we will comment about an image that was never pushed.
name: Docker build

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'config/fastmcp-http.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'README.md'
      - '.github/workflows/docker-build.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'config/fastmcp-http.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'README.md'
      - '.github/workflows/docker-build.yml'

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  docker-build:
    runs-on: ubuntu-latest
    env:
      # Single source of truth for "this run can publish": the canonical repo, and an
      # event that carries secrets. `github.repository` is the *base* repo on
      # pull_request, so it is true for fork PRs too — hence the explicit head-repo
      # comparison, which is what actually distinguishes a fork.
      PUBLISH: >-
        ${{ github.repository == 'kubecost/mcp-kubecost'
        && (github.event_name == 'push'
        || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ICR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: icr.io
          username: iamapikey
          password: ${{ secrets.IBM_CLOUD_API_KEY }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: icr.io/kubecost/mcp-kubecost
          tags: |
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-
            type=sha,prefix=sha-

      - name: Build and push to ICR
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image path summary
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          echo "## Container Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            echo "- \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"
          done

      # The digest check is a tripwire, not the gate. build-push-action only reports
      # containerimage.digest when an image exporter ran, so an empty value here means
      # the build did not actually push and the "image pushed" comment would be a lie.
      - name: Comment image digest on PR
        if: >-
          github.event_name == 'pull_request' &&
          env.PUBLISH == 'true' &&
          steps.build.outputs.digest != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        uses: actions/github-script@v9
        with:
          script: |
            const digest = process.env.DIGEST;
            const image = 'icr.io/kubecost/mcp-kubecost';
            const shaTag = process.env.TAGS.split('\n').find(t => t.includes('sha-')) || '';
            const shortTag = shaTag.split(':')[1] || '';
            const body = [
              '### 🐳 Docker image pushed',
              '',
              `**Image:** \`${shaTag || image + '@' + digest}\``,
              digest ? `**Digest:** \`${image}@${digest}\`` : '',
              '',
              '**Deploy to test:**',
              '```',
              'helm upgrade mcp-kubecost ./charts/mcp-kubecost \\',
              '  --reuse-values \\',
              `  --set image.tag=${shortTag}`,
              '```',
            ].filter(Boolean).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
