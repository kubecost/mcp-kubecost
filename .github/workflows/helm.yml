name: Helm chart validation

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

concurrency:
  group: helm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHART_DIR: charts/mcp-kubecost
  KUBERNETES_VERSION: 1.34.0

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5
        # use latest
        # with:
        #   version: v4.2.0

      - name: Lint chart and validate values schema
        run: helm lint "$CHART_DIR"

      - name: Render default chart
        run: |
          mkdir -p .helm-render
          helm template mcp-kubecost "$CHART_DIR" --namespace mcp-kubecost > .helm-render/mcp-kubecost-default.yaml
          grep -q 'image: "icr.io/kubecost/mcp-kubecost:' .helm-render/mcp-kubecost-default.yaml

      - name: Render Kubecost parent global image settings (public.ecr.aws override)
        run: |
          helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set global.imageRegistry=public.ecr.aws \
            --set 'global.imagePullSecrets={icr-pull}' \
            --set 'image.pullSecrets={app-pull}' \
            --set global.platforms.cicd.enabled=true \
            --set global.platforms.cicd.skipSanityChecks=true \
            > .helm-render/mcp-kubecost-global.yaml
          grep -q 'image: "public.ecr.aws/kubecost/mcp-kubecost:' .helm-render/mcp-kubecost-global.yaml
          grep -q 'name: icr-pull' .helm-render/mcp-kubecost-global.yaml
          grep -q 'name: app-pull' .helm-render/mcp-kubecost-global.yaml
          ! grep -q 'icr.io' .helm-render/mcp-kubecost-global.yaml

      - name: Render ingress and Secret-backed configuration
        run: >-
          helm template mcp-kubecost "$CHART_DIR"
          --namespace mcp-kubecost
          --set ingress.enabled=true
          --set config.kubecostApiKey.existingSecret=kubecost-api-key
          --set config.ssl.caBundle.existingSecret=kubecost-ca
          > .helm-render/mcp-kubecost-secure.yaml

      - name: Render preferred HTTPRoute configuration
        run: >-
          helm template mcp-kubecost "$CHART_DIR"
          --namespace mcp-kubecost
          --set httpRoute.enabled=true
          --set 'httpRoute.parentRefs[0].name=mcp-gateway'
          --set 'httpRoute.parentRefs[0].sectionName=https'
          --set config.kubecostApiKey.existingSecret=kubecost-api-key
          > .helm-render/mcp-kubecost-httproute.yaml

      - name: Render OAuth Ingress (auth-mode oidc, exposeAuthRoutes)
        run: |
          helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set config.authMode=oidc \
            --set config.oidc.issuerUrl=https://idp.example.com/.well-known/openid-configuration \
            --set config.oidc.clientId=x \
            --set config.oidc.clientSecret=y \
            --set config.oidc.exposeAuthRoutes=true \
            --set config.oidc.baseUrl=https://mcp.example.com \
            --set config.oidc.redirectPath='auth-mcp/' \
            --set config.oidc.authIngress.tlsSecretName=tls-sec \
            -s templates/ingress-oauth.yaml \
            > .helm-render/mcp-kubecost-oauth-ingress.yaml
          grep -q '^\s*- path: /auth-mcp$' .helm-render/mcp-kubecost-oauth-ingress.yaml
          # Ingress paths must start with "/"; hosts must not carry a port.
          ! grep -E '^\s*- path: [^/]' .helm-render/mcp-kubecost-oauth-ingress.yaml
          ! grep -E '^\s*host: .*:[0-9]+' .helm-render/mcp-kubecost-oauth-ingress.yaml

      - name: Render OAuth Ingress without baseUrl (expect failure)
        run: |
          if helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set config.authMode=oidc \
            --set config.oidc.issuerUrl=https://idp.example.com/.well-known/openid-configuration \
            --set config.oidc.clientId=x \
            --set config.oidc.clientSecret=y \
            --set config.oidc.exposeAuthRoutes=true \
            -s templates/ingress-oauth.yaml > /dev/null 2>&1; then
            echo "expected helm template to fail without config.oidc.baseUrl" >&2
            exit 1
          fi

      - name: Render OAuth Ingress with '..' in redirectPath (expect failure)
        run: |
          if helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set config.authMode=oidc \
            --set config.oidc.issuerUrl=https://idp.example.com/.well-known/openid-configuration \
            --set config.oidc.clientId=x \
            --set config.oidc.clientSecret=y \
            --set config.oidc.exposeAuthRoutes=true \
            --set config.oidc.baseUrl=https://mcp.example.com \
            --set config.oidc.redirectPath='/../auth-mcp' \
            -s templates/ingress-oauth.yaml > /dev/null 2>&1; then
            echo "expected helm template to fail with '..' in config.oidc.redirectPath" >&2
            exit 1
          fi

      - name: Render authMode both with kubecostApiKey.value (expect failure)
        run: |
          if helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set config.authMode=both \
            --set config.oidc.issuerUrl=https://idp.example.com/.well-known/openid-configuration \
            --set config.oidc.clientId=x \
            --set config.oidc.clientSecret=y \
            --set config.oidc.baseUrl=https://mcp.example.com \
            --set config.kubecostApiKey.value=dummy-key > /dev/null 2>&1; then
            echo "expected helm template to fail with authMode=both and kubecostApiKey.value" >&2
            exit 1
          fi

      - name: Render authMode both with kubecostApiKey.existingSecret (expect failure)
        run: |
          if helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set config.authMode=both \
            --set config.oidc.issuerUrl=https://idp.example.com/.well-known/openid-configuration \
            --set config.oidc.clientId=x \
            --set config.oidc.clientSecret=y \
            --set config.oidc.baseUrl=https://mcp.example.com \
            --set config.kubecostApiKey.existingSecret=kubecost-api-key > /dev/null 2>&1; then
            echo "expected helm template to fail with authMode=both and kubecostApiKey.existingSecret" >&2
            exit 1
          fi

      - name: Render authMode both without kubecostApiKey
        run: |
          helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set config.authMode=both \
            --set config.oidc.issuerUrl=https://idp.example.com/.well-known/openid-configuration \
            --set config.oidc.clientId=x \
            --set config.oidc.clientSecret=y \
            --set config.oidc.baseUrl=https://mcp.example.com \
            > .helm-render/mcp-kubecost-authmode-both.yaml
          grep -q 'AUTH_MODE: "both"' .helm-render/mcp-kubecost-authmode-both.yaml
          ! grep -q 'name: KUBECOST_API_KEY' .helm-render/mcp-kubecost-authmode-both.yaml

      - name: Validate rendered Kubernetes resources
        run: >-
          docker run --rm
          -v "$PWD:/work:ro"
          ghcr.io/yannh/kubeconform:v0.8.0
          -strict -summary -kubernetes-version "$KUBERNETES_VERSION"
          /work/.helm-render/mcp-kubecost-default.yaml /work/.helm-render/mcp-kubecost-secure.yaml /work/.helm-render/mcp-kubecost-oauth-ingress.yaml /work/.helm-render/mcp-kubecost-authmode-both.yaml

      - name: Validate core resources in HTTPRoute render
        run: >-
          docker run --rm
          -v "$PWD:/work:ro"
          ghcr.io/yannh/kubeconform:v0.8.0
          -strict -ignore-missing-schemas -summary -kubernetes-version "$KUBERNETES_VERSION"
          /work/.helm-render/mcp-kubecost-httproute.yaml

      - name: Run Kubernetes best-practice linter
        run: >-
          docker run --rm
          -v "$PWD:/work:ro"
          ghcr.io/stackrox/kube-linter:v0.8.3
          lint /work/$CHART_DIR

      - name: Lint rendered HTTPRoute
        run: >-
          docker run --rm
          -v "$PWD:/work:ro"
          ghcr.io/stackrox/kube-linter:v0.8.3
          lint /work/.helm-render/mcp-kubecost-httproute.yaml

      - name: Package chart
        run: helm package "$CHART_DIR" --destination /tmp/helm-package
