name: Helm chart validation

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

concurrency:
  group: helm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHART_DIR: charts/mcp-kubecost
  KUBERNETES_VERSION: 1.34.0

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint chart and validate values schema
        run: helm lint "$CHART_DIR"

      - name: Unit test templates
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.1.2
          helm unittest "$CHART_DIR"

      - name: Validate rendered manifests against the Kubernetes API schema
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          helm template mcp-kubecost "$CHART_DIR" --namespace mcp-kubecost \
            | ./kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
                -schema-location default -schema-location \
                'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
