name: Helm chart validation

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

concurrency:
  group: helm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHART_DIR: charts/mcp-kubecost
  KUBERNETES_VERSION: 1.34.0

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        # use latest
        # with:
        #   version: v4.2.0

      - name: Lint chart and validate values schema
        run: helm lint "$CHART_DIR"

      - name: Render default chart
        run: |
          mkdir -p .helm-render
          helm template mcp-kubecost "$CHART_DIR" --namespace mcp-kubecost > .helm-render/mcp-kubecost-default.yaml
          grep -q 'image: "icr.io/kubecost/mcp-kubecost:' .helm-render/mcp-kubecost-default.yaml
          grep -q 'replicas: 1' .helm-render/mcp-kubecost-default.yaml
          grep -q 'type: Recreate' .helm-render/mcp-kubecost-default.yaml

      - name: Reject replicas > 1 with persistence or OIDC (expect failure)
        run: |
          if out=$(helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set deployment.replicas=2 \
            --set persistence.enabled=true 2>&1); then
            echo "expected helm template to fail with replicas>1 and persistence.enabled=true" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -F -q 'deployment.replicas is greater than 1' || {
            echo "helm failed, but not because replicas>1 was combined with a PVC:" >&2
            echo "$out" >&2
            exit 1
          }
          if out=$(helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set deployment.replicas=2 \
            --set config.authMode=oidc \
            --set config.oidc.issuerUrl=https://idp.example.com/.well-known/openid-configuration \
            --set config.oidc.clientID=x \
            --set config.oidc.clientSecret=y 2>&1); then
            echo "expected helm template to fail with replicas>1 and authMode=oidc" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -F -q 'deployment.replicas is greater than 1' || {
            echo "helm failed, but not because replicas>1 was combined with OIDC:" >&2
            echo "$out" >&2
            exit 1
          }

      - name: Render multiple replicas without OAuth persistence
        run: |
          helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set deployment.replicas=2 \
            --set persistence.enabled=false \
            --set deployment.strategy.type=RollingUpdate \
            > .helm-render/mcp-kubecost-ha.yaml
          grep -q 'replicas: 2' .helm-render/mcp-kubecost-ha.yaml
          grep -q 'type: RollingUpdate' .helm-render/mcp-kubecost-ha.yaml
          ! grep -q 'kind: PersistentVolumeClaim' .helm-render/mcp-kubecost-ha.yaml

      - name: Render Kubecost parent global image settings (public.ecr.aws override)
        run: |
          helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set global.imageRegistry=public.ecr.aws \
            --set 'global.imagePullSecrets={icr-pull}' \
            --set 'image.pullSecrets={app-pull}' \
            --set global.platforms.cicd.enabled=true \
            --set global.platforms.cicd.skipSanityChecks=true \
            > .helm-render/mcp-kubecost-global.yaml
          grep -q 'image: "public.ecr.aws/kubecost/mcp-kubecost:' .helm-render/mcp-kubecost-global.yaml
          grep -q 'name: icr-pull' .helm-render/mcp-kubecost-global.yaml
          grep -q 'name: app-pull' .helm-render/mcp-kubecost-global.yaml
          ! grep -q 'icr.io' .helm-render/mcp-kubecost-global.yaml

      - name: Render ingress and Secret-backed configuration
        run: |
          helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set ingress.enabled=true \
            --set 'ingress.hosts[0].host=mcp.example.com' \
            --set config.kubecostApiKey.existingSecret=kubecost-api-key \
            --set config.ssl.caBundle.existingSecret=kubecost-ca \
            --set config.authMode=open \
            > .helm-render/mcp-kubecost-secure.yaml
          grep -q 'kind: Ingress' .helm-render/mcp-kubecost-secure.yaml
          grep -q 'host: "mcp.example.com"' .helm-render/mcp-kubecost-secure.yaml
          grep -q 'AUTH_MODE: "open"' .helm-render/mcp-kubecost-secure.yaml
          grep -q 'name: KUBECOST_API_KEY' .helm-render/mcp-kubecost-secure.yaml
          grep -q 'name: kubecost-api-key' .helm-render/mcp-kubecost-secure.yaml
          grep -q 'secretName: kubecost-ca' .helm-render/mcp-kubecost-secure.yaml
          grep -q 'SSL_CA_BUNDLE:' .helm-render/mcp-kubecost-secure.yaml
          ! grep -q 'kind: HTTPRoute' .helm-render/mcp-kubecost-secure.yaml

      - name: Render preferred HTTPRoute configuration
        run: |
          helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set httpRoute.enabled=true \
            --set 'httpRoute.parentRefs[0].name=mcp-gateway' \
            --set 'httpRoute.parentRefs[0].sectionName=https' \
            --set 'httpRoute.hostnames[0]=mcp.example.com' \
            --set config.kubecostApiKey.existingSecret=kubecost-api-key \
            --set config.authMode=open \
            > .helm-render/mcp-kubecost-httproute.yaml
          grep -q 'kind: HTTPRoute' .helm-render/mcp-kubecost-httproute.yaml
          grep -q 'name: mcp-gateway' .helm-render/mcp-kubecost-httproute.yaml
          grep -q 'sectionName: https' .helm-render/mcp-kubecost-httproute.yaml
          grep -q 'mcp.example.com' .helm-render/mcp-kubecost-httproute.yaml
          grep -q 'AUTH_MODE: "open"' .helm-render/mcp-kubecost-httproute.yaml
          grep -q 'name: KUBECOST_API_KEY' .helm-render/mcp-kubecost-httproute.yaml
          grep -q 'name: kubecost-api-key' .helm-render/mcp-kubecost-httproute.yaml
          ! grep -q 'kind: Ingress' .helm-render/mcp-kubecost-httproute.yaml

      - name: Reject removed authMode both
        run: |
          if out=$(helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set config.authMode=both 2>&1); then
            echo "expected helm template to fail with removed authMode=both" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -F -q "value must be one of 'none', 'open', 'oidc', 'api_key'" || {
            echo "helm failed, but not because authMode=both was rejected by the schema:" >&2
            echo "$out" >&2
            exit 1
          }

      - name: Render authMode none with httproute enabled (expect failure)
        run: |
          if out=$(helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set config.authMode=none \
            --set httpRoute.enabled=true 2>&1); then
            echo "expected helm template to fail with authMode=none and httpRoute.enabled" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -F -q 'config.authMode "none" with an exposed route is not permitted' || {
            echo "helm failed, but not because authMode=none was combined with an exposed route:" >&2
            echo "$out" >&2
            exit 1
          }

      - name: Reject enabled routes without hostnames (expect failure)
        run: |
          for case in \
            "ingress.enabled=true|ingress.hosts is empty" \
            "httpRoute.enabled=true|httpRoute.parentRefs is empty"; do
            set_arg="${case%%|*}"
            expect="${case##*|}"
            if out=$(helm template mcp-kubecost "$CHART_DIR" \
              --namespace mcp-kubecost \
              --set config.authMode=open \
              --set "$set_arg" 2>&1); then
              echo "expected helm template to fail for $set_arg" >&2
              echo "$out" >&2
              exit 1
            fi
            echo "$out"
            echo "$out" | grep -F -q "$expect" || {
              echo "helm failed for $set_arg, but not with the expected message: $expect" >&2
              echo "$out" >&2
              exit 1
            }
          done
          if out=$(helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set config.authMode=open \
            --set httpRoute.enabled=true \
            --set 'httpRoute.parentRefs[0].name=mcp-gateway' 2>&1); then
            echo "expected helm template to fail when httpRoute.hostnames is empty" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -F -q 'httpRoute.hostnames is empty' || {
            echo "helm failed, but not because httpRoute.hostnames is empty:" >&2
            echo "$out" >&2
            exit 1
          }

      - name: Fall back to global.defaultStorageClass for the OAuth PVC
        run: |
          helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set config.authMode=api_key \
            --set persistence.enabled=true \
            --set global.defaultStorageClass=fast-ssd \
            > .helm-render/mcp-kubecost-storageclass.yaml
          grep -q 'storageClassName: "fast-ssd"' .helm-render/mcp-kubecost-storageclass.yaml
          helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set config.authMode=api_key \
            --set persistence.enabled=true \
            --set global.defaultStorageClass=fast-ssd \
            --set persistence.storageClass=gp3 \
            | grep -q 'storageClassName: "gp3"'

      - name: Force requireClientApiKey with authMode api_key
        run: |
          helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set config.authMode=api_key \
            --set config.requireClientApiKey=false \
            > .helm-render/mcp-kubecost-api-key.yaml
          grep -q 'AUTH_MODE: "api_key"' .helm-render/mcp-kubecost-api-key.yaml
          grep -q 'REQUIRE_CLIENT_API_KEY: "true"' .helm-render/mcp-kubecost-api-key.yaml

      - name: Render authMode oidc with requireClientApiKey and shared kubecostApiKey
        run: |
          helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set config.authMode=oidc \
            --set config.requireClientApiKey=true \
            --set config.kubecostApiKey.value=dummy-key \
            --set config.externalUrl="https://kubecost.example.com" \
            --set config.oidc.issuerUrl=https://idp.example.com/.well-known/openid-configuration \
            --set config.oidc.clientID=x \
            --set config.oidc.clientSecret=y \
            --set-string 'config.oidc.allowedClientRedirectUris=["http://localhost:*"\,"https://client.example/callback"]' \
            > .helm-render/mcp-kubecost-oidc-apikey.yaml
          grep -q 'AUTH_MODE: "oidc"' .helm-render/mcp-kubecost-oidc-apikey.yaml
          grep -q 'REQUIRE_CLIENT_API_KEY: "true"' .helm-render/mcp-kubecost-oidc-apikey.yaml
          grep -F -q 'OIDC_ALLOWED_CLIENT_REDIRECT_URIS: "[\"http://localhost:*\",\"https://client.example/callback\"]"' .helm-render/mcp-kubecost-oidc-apikey.yaml
          grep -q 'name: KUBECOST_API_KEY' .helm-render/mcp-kubecost-oidc-apikey.yaml

      # config.externalUrl is the single public origin; the server derives the
      # fixed /mcp and /oauth/mcp paths from it internally.
      - name: Render OIDC with externalUrl
        run: |
          helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set config.authMode=oidc \
            --set config.externalUrl=https://kubecost.example.com \
            --set config.oidc.issuerUrl=https://idp.example.com/.well-known/openid-configuration \
            --set config.oidc.clientID=x \
            --set config.oidc.clientSecret=y \
            > .helm-render/mcp-kubecost-oidc-subpath.yaml
          grep -q 'MCP_EXTERNAL_URL: "https://kubecost.example.com"' .helm-render/mcp-kubecost-oidc-subpath.yaml
          if grep -q 'OIDC_ALLOWED_CLIENT_REDIRECT_URIS:' .helm-render/mcp-kubecost-oidc-subpath.yaml; then
            echo "expected Open OIDC render to omit OIDC_ALLOWED_CLIENT_REDIRECT_URIS" >&2
            exit 1
          fi

      # The issuer scheme rule mirrors the MCP SDK's validate_issuer_url:
      # https everywhere, with an http carve-out for localhost only.
      - name: Accept an http localhost issuer
        run: |
          helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set config.authMode=oidc \
            --set config.externalUrl="https://kubecost.example.com" \
            --set config.oidc.issuerUrl=http://localhost:8080/realms/x/.well-known/openid-configuration \
            --set config.oidc.clientID=x \
            --set config.oidc.clientSecret=y \
            > /dev/null

      - name: Render plaintext non-localhost issuer (expect failure)
        run: |
          if out=$(helm template mcp-kubecost "$CHART_DIR" \
            --namespace mcp-kubecost \
            --set config.authMode=oidc \
            --set config.externalUrl="https://kubecost.example.com" \
            --set config.oidc.issuerUrl=http://keycloak.keycloak.svc/realms/x/.well-known/openid-configuration \
            --set config.oidc.clientID=x \
            --set config.oidc.clientSecret=y 2>&1); then
            echo "expected helm template to fail with a plaintext non-localhost issuerUrl" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -F -q 'config.oidc.issuerUrl must be an https:// URL' || {
            echo "helm failed, but not because issuerUrl was plaintext on a non-localhost host:" >&2
            echo "$out" >&2
            exit 1
          }

      - name: Validate rendered Kubernetes resources
        run: >-
          docker run --rm
          -v "$PWD:/work:ro"
          ghcr.io/yannh/kubeconform:v0.8.0
          -strict -summary -kubernetes-version "$KUBERNETES_VERSION"
          /work/.helm-render/mcp-kubecost-default.yaml
          /work/.helm-render/mcp-kubecost-ha.yaml
          /work/.helm-render/mcp-kubecost-global.yaml
          /work/.helm-render/mcp-kubecost-secure.yaml
          /work/.helm-render/mcp-kubecost-api-key.yaml
          /work/.helm-render/mcp-kubecost-oidc-apikey.yaml
          /work/.helm-render/mcp-kubecost-oidc-subpath.yaml

      - name: Run Kubernetes best-practice linter
        run: >-
          docker run --rm
          -v "$PWD:/work:ro"
          ghcr.io/stackrox/kube-linter:v0.8.3
          lint /work/$CHART_DIR

      # HTTPRoute has no built-in kubeconform schema. Chart-dir kube-linter uses
      # default values (httpRoute.enabled=false), so lint the render separately.
      - name: Lint rendered HTTPRoute
        run: >-
          docker run --rm
          -v "$PWD:/work:ro"
          ghcr.io/stackrox/kube-linter:v0.8.3
          lint /work/.helm-render/mcp-kubecost-httproute.yaml

      - name: Package chart
        run: helm package "$CHART_DIR" --destination /tmp/helm-package
